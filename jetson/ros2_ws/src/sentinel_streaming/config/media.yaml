/**:
  ros__parameters:
    # 입력 — S15P11A301-62 확정 계약
    input_topic: /camera/image_raw/compressed
    input_width: 1280
    input_height: 720
    input_framerate: 30

    # MJPEG 디코딩 — PoC-A에서 nvjpegdec는 5.09 FPS로 기각됐다.
    # SW 폴백은 jpegdec(29.9 FPS 검증).
    decoder: nvv4l2decoder
    decoder_fallback: jpegdec

    # 인코딩 출력 프레임레이트 (S15P11A301-186에서 도입, -191에서 30으로 되돌림).
    #
    # **기본은 캡처와 같은 30이다. 내리는 것은 CPU 포화가 관측됐을 때만 한다.**
    #
    # 186에서 이 값을 15로 내렸다가 되돌렸다. 근거로 든 명세 항목을 잘못 읽었다.
    # 25.5에 "인코딩 출력 15FPS 목표"가 있지만 바로 뒤에 "(CPU 부하 시 15FPS
    # 우선)"이라는 조건절이 붙는다. 나머지 두 근거는 아예 표의 성격을 잘못 봤다 —
    # R-04(01:446)는 「18. 위험 관리와 대체안」의 *대응·대체안* 열이고,
    # 05:1421은 「장애 / 즉시 동작 / 복구·대체」의 *복구책* 열이다. 둘 다 포화
    # 상황의 대응이며 기본 설계가 아니다.
    #
    # 같은 표가 오히려 반대를 가리킨다. CPU가 부족할 때 먼저 줄이라고 지목하는
    # 대상은 스트리밍이 아니라 추론이다.
    #
    #   AI branch 지연        → 입력 해상도·추론 FPS 감소
    #   HW MJPEG 디코딩 실패  → CPU 여유 부족 시 AI 추론 FPS 우선 감소
    #   녹화 branch 지연      → 스트리밍 비트레이트 우선 감소
    #
    # 스트리밍을 손대는 것은 그보다 뒤이고, 그때도 프레임레이트가 아니라
    # 비트레이트가 먼저다.
    #
    # 실측도 15로 내릴 이유가 되지 못했다. x264enc CPU를 85.7%에서 47.5%로
    # 27%p 풀어줘도 추론은 13.33에서 13.82 FPS로 +0.49밖에 오르지 않는다.
    # 병목이 CPU 사이클이 아니라 LPDDR5 대역폭이기 때문이다(186 참고).
    #
    # 내려야 할 때가 오면(Nav2가 올라와 실제로 포화되면) 이 값과 아래
    # encoder_key_int_max를 **함께** 내린다. 하나만 내리면 링 조각이 깨진다.
    # videorate 요소는 30에서 실질 무동작이므로 남겨 두었다 — 그때 설정값만
    # 바꾸면 된다.
    encode_framerate: 30

    # H.264 인코딩 — Orin Nano에 NVENC가 없어 x264enc(CPU)를 쓴다.
    # PoC-B 3차에서 이 설정으로 30.020 fps를 확인했다.
    encoder_bitrate_kbps: 2500
    encoder_speed_preset: ultrafast
    encoder_tune: zerolatency
    # **encode_framerate와 항상 같게 둔다.** 링 버퍼가 이 값에 의존한다 —
    # ring_buffer.py는 send-keyframe-requests를 false로 두면서 "key-int-max가 이미
    # 1초마다 IDR을 만든다"를 근거로 삼는다. 한쪽만 바꾸면 IDR 간격이 1초가
    # 아니게 되고, 그러면 splitmuxsink가 max-size-time에 도달해도 쪼갤 IDR이 없어
    # 1초 조각이 길어진다. 사전 영상 3초의 granularity가 무너지고
    # ring_stall_timeout_seconds 여유도 줄어든다.
    #
    # 어긋나면 stream_pipeline_node가 경고를 남긴다(_check_keyframe_interval).
    encoder_key_int_max: 30
    encoder_bframes: 0

    # MediaMTX 발행
    #
    # rtsp       : rtspclientsink로 직접 publish한다. 표준 경로이며
    #              gstreamer1.0-rtsp 패키지가 필요하다(rosdep이 설치한다).
    # udp_mpegts : mpegtsmux + udpsink로 보내고 MediaMTX가
    #              udp+mpegts://로 받는다. 추가 패키지가 필요 없다.
    #
    # rtsp를 지정했는데 rtspclientsink가 없으면 경고 후 udp_mpegts로 폴백한다.
    publish_mode: rtsp
    rtsp_url: rtsp://127.0.0.1:8554/sentinel
    udp_host: 127.0.0.1
    udp_port: 8890

    # 큐 정책 — 스트리밍은 leaky, 녹화는 non-leaky(32장 장애 격리 원칙)
    stream_queue_buffers: 3
    record_queue_buffers: 60

    # 링 버퍼 분기 활성화 여부 (S15P11A301-123).
    # false면 tee에 fakesink를 붙여 분기 지점만 유지한다. tee의 한 분기를
    # 비워두면 파이프라인이 PREROLL에서 멈추므로 반드시 무엇이든 달아야 한다.
    #
    # 기본을 true로 바꿨다(S15P11A301-156). 이 값이 false였던 것은 녹화 노드가
    # 생기기 전(S15P11A301-123 이전)의 흔적이고, 지금은 녹화가 상시 구성이다
    # (32-5). buffer_directory를 만들 수 없으면 노드가 녹화 없이 스트리밍만
    # 계속하므로(32장 장애 격리) 개발 기기에서도 이 기본값이 해롭지 않다.
    enable_record_branch: true

    # 링 버퍼 (32-5). 1초 MPEG-TS 조각을 순환 보관한다.
    #
    # ring_segments가 8인 이유는 3초 사전 영상을 보장하면서 복사 지연과 디스크
    # 쓰기 여유를 두기 위해서다(32-5 표). 조각을 hard link로 가져가므로 링이
    # 원본을 지워도 이벤트 영상은 안전하다.
    #
    # buffer_directory는 pending과 같은 볼륨에 둔다(32-5). 절대경로를 코드에
    # 박지 않고 이 설정으로만 참조한다.
    buffer_directory: /var/lib/sentinel/media/buffer
    segment_seconds: 1
    ring_segments: 8
    # 카메라 프레임은 계속 들어오는데 새 조각이 이 시간 이상 열리지 않으면
    # splitmuxsink 교착으로 보고 파이프라인을 재구성한다(S15P11A301-161).
    ring_stall_timeout_seconds: 3.0

    # 이벤트 영상 오디오 트랙 (S15P11A301-131, 32-5 「H.264/AAC 재다중화」).
    #
    # 관제 스트리밍(RTSP)에는 오디오를 넣지 않는다. 링 분기에만 붙는다. 32-6이
    # 요구조자와의 대화를 증빙으로 두므로 남겨야 하는 것은 이벤트 파일이고,
    # 실시간 화면에 소리를 얹으면 지연 예산(32-8)이 늘어난다.
    #
    # 마이크가 없거나 열리지 않으면 노드가 오디오를 끄고 비디오만으로 다시
    # 세운다. 소리 때문에 녹화 전체를 잃지 않는다.
    #
    # 소스가 pulsesrc인 이유는 BRIO 100이 PulseAudio에만 잡히기 때문이다.
    # 마이크는 확정되지 않았다(TBD-AUD-001) — STT 인식률 미달 시 USB 마이크로
    # 바꾸고 이 값을 alsasrc device=hw:N으로 내린다.
    enable_audio: true

    # buffer-time과 latency-time을 기본값보다 크게 줍니다. 기본값(200ms / 10ms)으로
    # 5분 이벤트를 녹화하니 1초 조각마다 오디오가 620ms만 담겼습니다. 38% 손실이며
    # 로그에 `Can't record audio fast enough`가 반복됐습니다.
    #
    # 원인은 스케줄링입니다. x264enc(CPU 인코딩)와 YOLO 탐지가 코어를 다 쓰면
    # pulsesrc의 읽기 스레드가 늦게 깨고, 그동안 PulseAudio 링버퍼가 넘쳐 샘플이
    # 버려집니다. 손실은 큐에 닿기 전 소스 안에서 일어나므로 큐를 키워도 소용없습니다.
    #
    #   buffer-time  2초   넘치기까지의 여유. 늦게 깨어나도 견딘다
    #   latency-time 50ms  깨어나는 횟수를 1/5로 줄인다
    #
    # 지연이 늘지만 이벤트 파일에만 쓰이므로 상관없습니다. 관제 스트리밍에는
    # 오디오를 넣지 않습니다.
    audio_source: pulsesrc buffer-time=2000000 latency-time=50000
    audio_encoder: voaacenc bitrate=64000
    audio_rate: 48000
    audio_channels: 1

    # 오디오 큐 용량을 시간으로 잽니다. 버퍼 개수로 재면 latency-time을 바꿀 때
    # 실제 용량이 같이 바뀝니다(10ms일 때 64개는 0.64초, 50ms면 3.2초).
    audio_queue_seconds: 3

    # 입력 끊김 복구 — 무한 재시작 금지(32-3)
    restart_backoff_seconds: [1.0, 2.0, 4.0]
    restart_max_attempts: 3
    input_timeout_seconds: 3.0
