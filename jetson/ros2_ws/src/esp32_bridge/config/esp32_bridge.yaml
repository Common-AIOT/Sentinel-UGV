# esp32_bridge 기본 설정 (S15P11A301-84)
#
# 아래 별칭은 scripts/udev/99-sentinel-mcu.rules 가 만든다(S15P11A301-214).
# 두 보드는 CH340(1a86:7523)이고 시리얼 번호가 없어서 by-id 로는 구분할 수
# 없다. 그래서 USB 물리 경로로 고정한다 - devpath 2.3=센서, 2.4=모터.
# ttyUSB 번호는 기동마다 뒤바뀌지만 물리 경로는 안 바뀐다. 규칙을 설치하지
# 않은 장비에서는 launch 인자(motor_port/sensor_port)로 실제 경로를 넘긴다.
#
# 별칭은 "어느 USB 구멍에 꽂혔나"를 고정할 뿐 보드의 역할을 보장하지는 않는다.
# 배선을 바꿔 꽂았다면 HELLO_ACK.board_role 로 실제 역할을 확인하는 쪽
# (esp32_hello_check, 노드 로그의 핸드셰이크 오류)을 우선 신뢰할 것.
esp32_motor_bridge:
  ros__parameters:
    port: /dev/sentinel_mcu_motor
    baudrate: 921600
    handshake_retry_period_s: 1.0

esp32_sensor_bridge:
  ros__parameters:
    port: /dev/sentinel_mcu_sensor
    baudrate: 921600
    # 300ms 통신 워치독의 절반 이하 - §34-7 gap-fill(계획 §8, 열린 리스크 2).
    keepalive_period_s: 0.15

    # ---- 토픽·프레임 (Phase 0 메시지 계약) ----
    odometry_topic: /wheel/odometry
    imu_topic: /imu/data_raw
    range_topic: /range/front
    protective_stop_topic: /proximity/protective_stop
    temperature_topic: /environment/temperature
    relative_humidity_topic: /environment/relative_humidity
    odom_frame_id: odom
    base_frame_id: base_footprint
    # sentinel_description의 imu_link. base_link 기준 오프셋은 아직 전부 0인
    # placeholder다(§35-7, TBD-HW-012).
    imu_frame_id: imu_link
    range_frame_id: ultrasonic_front_link
    environment_frame_id: base_link

    # slam.launch.py가 odom->base_footprint를 static identity로 발행하는 동안은
    # 반드시 false여야 한다(두 발행자가 같은 TF를 다툰다). static을
    # publish_static_odom:=false로 끄거나 ekf_node가 TF를 소유하게 된 뒤에 판단한다.
    publish_odom_tf: false

    # ---- 오도메트리 캘리브레이션 (TBD-CAL-001, §35-3) ----
    # meters_per_tick 기본값 = (pi * 0.120m) / (16384 counts * 82 기어비)
    #   = 2.806e-07 m/tick. sensor_task.cpp의 실측 전 임시 상수에서 유도한 값이라
    #   3m 직선 5회 실측(좌·우 개별) 후 반드시 덮어쓴다. 좌·우를 따로 두는 이유는
    #   합격 기준이 "좌우 편차 ±3%p"라 개별 스케일로만 보정할 수 있어서다.
    meters_per_tick_left: 2.806e-07
    meters_per_tick_right: 2.806e-07
    # 후륜 접지 중심 거리. 2026-08-06 전륜 조향 복구 이후로는 이 값으로 만든
    # yaw 를 EKF 에 넣지 않는다 — 조향 링크가 회두를 정하고 후륜이 같은 속도로
    # 구동돼 선회 중 스크럽하므로 좌·우 속도 차가 기하와 맞지 않는다(§35-3).
    # yaw 의 주 소스는 IMU 자이로다. 실측은 §35-3 의 δ_max 원주행으로 하며
    # (제자리 회전은 이제 불가능하다) 여기 값은 x·y 적분과 비교 측정용이다.
    track_width_m: 0.30
    # tick 점프·I2C 노이즈 샘플을 거르는 상한. 실제 최고 속도보다 넉넉히 크게.
    max_wheel_speed_mps: 2.0
    # 대각 성분만 지정한다(x, y, z, roll, pitch, yaw). 후륜 엔코더가 측정하지 않는
    # 자유도는 1e6으로 둬 EKF가 융합하지 않게 한다. 바퀴 미끄럼이 크면 x·yaw를
    # 더 키우고 IMU yaw 가중을 높인다(명세 23.2).
    odom_pose_covariance_diagonal: [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
    odom_twist_covariance_diagonal: [0.02, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.05]

    # ---- MPU6050 IMU (S15P11A301-244) ----
    # 진동·bias 실측(TBD-HW-012) 전 임시값이다. 데이터시트 잡음 밀도만 보면
    # gyro는 3e-7 (rad/s)^2 수준이지만, 실제로는 차체 진동과 온도 bias 변동이
    # 지배하므로 보수적으로 (0.02 rad/s)^2 = 4e-4, accel은 (0.2 m/s^2)^2 = 4e-2로
    # 둔다.
    #
    # **2026-08-04 정지 실측(S15P11A301-236): gyro_z 표준편차 0.00715 rad/s →
    # 분산 5.1e-05.** 지금 값(4e-4)의 약 1/8 이다. 그래도 낮추지 않는다 — 이
    # 측정은 IMU 가 차체에 고정되지 않고 로봇이 정지한 조건이라, 위 주석이 지목한
    # 지배 항(차체 진동)이 빠져 있다. 낮추면 실차에서 IMU 를 과신한다.
    # **5.1e-05 는 하한이다.** 주행 로그로 재측정해 그 사이 값으로 확정한다
    # (S15P11A301-248).
    imu_angular_velocity_variance: 4.0e-04
    imu_linear_acceleration_variance: 4.0e-02
    # CALIBRATING·RANGE_ERROR·clock offset 미안정 구간에 싣는 값. 값은 Foxglove로
    # 보이되 EKF가 융합하지 않게 하는 것이 목적이다(Inf/NaN은 구독자를 깨뜨린다).
    imu_untrusted_variance: 1.0e+06
    # 보드 monotonic 시계 오프셋 재동기 주기(초). 창 길이 × 크리스털 드리프트가
    # 타임스탬프 오차 상한이다(10s·100ppm = 1ms).
    imu_clock_resync_period_s: 10.0

    # ---- HC-SR04 (sensor_task.cpp의 MIN/MAX_VALID_DISTANCE_CM과 맞출 것) ----
    range_min_m: 0.02
    range_max_m: 4.0
    range_field_of_view_rad: 0.26  # 데이터시트 유효 각도 약 15deg
