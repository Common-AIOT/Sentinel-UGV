  <line class="rule" x1="0" y1="74" x2="198" y2="74"/>

  <rect class="cardOn" x="10" y="84" width="178" height="30" rx="2"/>
  <text class="tb" x="20" y="103">08-06 14:12</text>
  <text x="178" y="103" fill="#b0450d" font-size="11" text-anchor="end">3명</text>

  <rect class="card" x="10" y="120" width="178" height="30" rx="2"/>
  <text class="t" x="20" y="139">08-06 11:40</text>
