# nginx(443) 뒤에서 X-Forwarded-Proto/Host 를 읽어 자기 주소를 https 로 인식하게 한다.
# 없으면 운영 Swagger(같은 도메인)의 요청조차 다른 출처로 오인해 CORS 403 이 난다.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # spring.docker.compose.file 은 두지 않는다. 종전 값 `backend/compose.yaml` 은
  # 없는 파일이었고(실제 파일은 compose.local.yaml·compose.prod.yaml), local 프로필이
  # `spring.docker.compose.enabled: false` 로 이 지원 자체를 끈다. 로컬 컨테이너는
  # 그쪽 주석대로 compose 로 직접 올린다: docker compose -f compose.local.yaml up -d

app:
  cors:
    # 관제 웹은 Vercel, API 는 EC2 라서 출처가 다르다. 브라우저에서 직접 호출하는 출처만 허용한다.
    # sentinel-ugv.xyz 는 운영 프론트의 커스텀 도메인이다(Vercel 연결).
    # `https://*.vercel.app` 는 프리뷰 배포용이며 도메인이 매번 바뀌기 때문에 필요하다.
    # api.sentinel-ugv.xyz 와 localhost:8080 은 Swagger Try it out 용이다(운영·로컬 Swagger).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sentinel-ugv.xyz,http://localhost:3000,http://localhost:8080,https://api.sentinel-ugv.xyz,https://sentinel-ugv-frontend.vercel.app,https://*.vercel.app}
  mqtt:
    # 스프링은 브로커와 같은 도커 네트워크에 있으므로 내부 평문 리스너로 붙는다.
    # 이 포트는 외부에 publish 하지 않는다(명세 31-11).
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:spring-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  s3:
    # **기본값을 두지 않는다.** 종전에는 endpoint 가 운영 MinIO(s3.sentinel-ugv.xyz),
    # access-key 가 admin 이었다. 이 파일은 프로필 공통이므로, 주입이 하나라도 빠지면
    # 조용히 운영 스토리지를 admin 으로 가리켰다 — 틀린 곳에 쓰기 시작할 때까지
    # 아무 신호가 없는 형태다. 비워 두면 그 경우 기동이 바로 실패한다.
    #
    # 운영은 compose.prod.yaml 이 .env 에서 다섯 값을 모두 넘기고, 로컬 기본값은
    # application-local.yml 에 있다.
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
