# esp32_bridge 기본 설정 (S15P11A301-84)
#
# 아래 별칭은 scripts/udev/99-sentinel-mcu.rules 가 만든다(S15P11A301-214).
# 두 보드는 CH340(1a86:7523)이고 시리얼 번호가 없어서 by-id 로는 구분할 수
# 없다. 그래서 USB 물리 경로로 고정한다 - devpath 2.3=센서, 2.4=모터.
# ttyUSB 번호는 기동마다 뒤바뀌지만 물리 경로는 안 바뀐다. 규칙을 설치하지
# 않은 장비에서는 launch 인자(motor_port/sensor_port)로 실제 경로를 넘긴다.
#
# 별칭은 "어느 USB 구멍에 꽂혔나"를 고정할 뿐 보드의 역할을 보장하지는 않는다.
# 배선을 바꿔 꽂았다면 HELLO_ACK.board_role 로 실제 역할을 확인하는 쪽
# (esp32_hello_check, 노드 로그의 핸드셰이크 오류)을 우선 신뢰할 것.
esp32_motor_bridge:
  ros__parameters:
    port: /dev/sentinel_mcu_motor
    baudrate: 921600
    # Jetson 최종 송신 경계의 이중 안전 한계. vehicle_kinematics를 우회해 이
    # 브리지 토픽에 직접 들어온 명령도 ESP32로 보내기 전에 대칭 포화한다.
    # max_steering_mdeg는 2026-08-06 실측 링키지 한계(±22°)와 맞춘 값이다.
    max_drive_mmps: 300
    max_steering_mdeg: 22000
    # 300ms 통신 워치독의 절반 이하 - §34-7 gap-fill, 센서 브리지와 같은 근거
    # (S15P11A301-321 전에는 이 노드에 keepalive가 아예 없어, 핸드셰이크 이후로는
    # ~/drive_command가 끊기면 모터 링크가 완전히 조용해졌다).
    keepalive_period_s: 0.15

esp32_sensor_bridge:
  ros__parameters:
    port: /dev/sentinel_mcu_sensor
    baudrate: 921600
    # 300ms 통신 워치독의 절반 이하 - §34-7 gap-fill(계획 §8, 열린 리스크 2).
    keepalive_period_s: 0.15

    # ---- 토픽·프레임 (Phase 0 메시지 계약) ----
    odometry_topic: /wheel/odometry
    imu_topic: /imu/data_raw
    range_topic: /range/front
    protective_stop_topic: /proximity/protective_stop
    temperature_topic: /environment/temperature
    relative_humidity_topic: /environment/relative_humidity
    odom_frame_id: odom
    base_frame_id: base_footprint
    # sentinel_description의 imu_link. base_link 기준 오프셋은 아직 전부 0인
    # placeholder다(§35-7, TBD-HW-012).
    imu_frame_id: imu_link
    range_frame_id: ultrasonic_front_link
    environment_frame_id: base_link

    # slam.launch.py가 odom->base_footprint를 static identity로 발행하는 동안은
    # 반드시 false여야 한다(두 발행자가 같은 TF를 다툰다). static을
    # publish_static_odom:=false로 끄거나 ekf_node가 TF를 소유하게 된 뒤에 판단한다.
    publish_odom_tf: false

    # ---- 오도메트리 캘리브레이션 (TBD-CAL-001, §35-3) ----
    # meters_per_tick = (pi * 바퀴지름) / (16384 counts * 82 기어비)
    #
    # **바퀴 지름 0.25m 는 실측이다**(2026-08-07, S15P11A301-337). 종전 값은
    # sensor_task.cpp 의 임시 상수에서 유도한 0.120m 가정이었고, 실제의 절반보다
    # 작았다. 그 결과 로봇이 1m 를 가면 오도메트리가 48cm 로 보고했고, SLAM 이
    # 실제의 절반 크기로 지도를 그려 Nav2 가 경로를 만들지 못했다
    #   ("GridBased: failed to create plan").
    #
    #   (pi * 0.25) / (16384 * 82) = 5.846e-07 m/tick
    #
    # **계산식과 실측이 일치한다.** 지름 0.25m 와 기어비 82 둘 다 맞다.
    #
    # 2026-08-08 실측(스택 한 벌, 주행 중 재부팅 0, 진단 fault 전부 0):
    # 뒷바퀴 한쪽을 손으로 반 바퀴(0.393m) 돌렸을 때 그 채널이 655,261 tick 을
    # 냈다. 1회전 환산 1,310,522 tick 이고 계산값 16384x82 = 1,343,488 과 2.5%
    # 안에서 맞는다(차이는 손 회전량 오차와 하중 눌림 몫이다).
    #
    # **좌·우 후륜은 독립 구동이다** — 기계식 차동장치가 없다는 것은 좌·우가
    # 강결합이라는 뜻이 아니다(02장, BTS7960 좌·우 2개). 각 바퀴에 모터와 엔코더가
    # 따로 있어 **한쪽만 손으로 돌리면 다른 쪽은 0 이다.** 브리지가 좌우를 평균하므로
    # (wheel_odometry 의 center_distance_m) 그때 보고값은 그 바퀴 이동의 절반이다.
    #
    # 이 자리에 한때 1.169e-06(계산값의 2배)이 들어가 있었다. 위 「강결합」을
    # 오독해 한쪽만 돌린 측정의 절반 효과를 스케일 오차로 착각한 것이다. 두 오류가
    # **거리에서만 서로 상쇄돼** 오래 안 보였다 — 드러난 자리는 yaw 였다. 반 바퀴
    # 손 회전에 yaw 가 -81.6도로 나왔고, 올바른 상수에서는 -42.5도여야 한다
    # (delta_yaw = (right - left) / track_width 이므로 한쪽만 돌면 이 값이 정상이다).
    #
    # 앞서 「실측이 계산값의 2배다 → 유효 기어비 41」로 적었던 것은 **철회한다.**
    #
    # **주행 구간은 아직 측정되지 않았다.** 앞선 측정(실제 약 4m 를 1.87m 로 보고)은
    # 오염됐다 — 그 시각에 브리지가 센서 보드 재부팅을 73초 동안 29회 감지했고,
    # 재부팅마다 reset_encoder_origin() 이 불려 그 구간 이동량이 버려진다. 스택도
    # 두 벌 떠 있었다(S15P11A301-338·340). 재측정 조건은 스택 한 벌 + 재부팅 0 이며,
    # 2026-08-08 에 한 벌로 띄웠을 때 재부팅 감지는 0 이었다.
    #
    # 에일리어싱은 이 속도에서 원인이 아니다. 샘플링 100Hz 의 모호성 한계는 모터축
    # 50 rev/s 이고 0.25 m/s 에서 모터축은 26.1 rev/s 로 절반 이하다.
    #
    # **아직 좌·우를 따로 재지 않았다.** 같은 값을 넣어 두었고, 3m 직선 5회
    # 실측(좌·우 개별)으로 덮어써야 한다 — 합격 기준이 "좌우 편차 +-3%p"라
    # 개별 스케일로만 보정할 수 있다(S15P11A301-299 3단계).
    #
    meters_per_tick_left: 5.846e-07
    meters_per_tick_right: 5.846e-07
    # 후륜 접지 중심 거리. **0.53m 는 실측이다**(2026-08-07, S15P11A301-337).
    # 종전 0.30 은 실측값이 아예 없던 자리표시자였다.
    #
    # 2026-08-06 전륜 조향 복구 이후로는 이 값으로 만든 yaw 를 EKF 에 넣지
    # 않는다 — 조향 링크가 회두를 정하고 후륜이 같은 속도로 구동돼 선회 중
    # 스크럽하므로 좌·우 속도 차가 기하와 맞지 않는다(§35-3). yaw 의 주 소스는
    # IMU 자이로다. 여기 값은 x·y 적분과 비교 측정용이다.
    #
    # **자로 잰 값이라 실효 트랙폭과 다를 수 있다.** 타이어 폭이 9cm 라 접지점이
    # 중심과 어긋나고, 선회 중 후륜 스크럽이 있으면 실효값이 커진다. 주행
    # 실측으로 다시 잡는 것은 §35-3 δ_max 원주행이다(S15P11A301-299 3단계).
    track_width_m: 0.53
    # tick 점프·I2C 노이즈 샘플을 거르는 상한. 실제 최고 속도보다 넉넉히 크게.
    max_wheel_speed_mps: 2.0
    # 대각 성분만 지정한다(x, y, z, roll, pitch, yaw). 후륜 엔코더가 측정하지 않는
    # 자유도는 1e6으로 둬 EKF가 융합하지 않게 한다. 바퀴 미끄럼이 크면 x·yaw를
    # 더 키우고 IMU yaw 가중을 높인다(명세 23.2).
    odom_pose_covariance_diagonal: [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
    odom_twist_covariance_diagonal: [0.02, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.05]

    # ---- MPU6050 IMU (S15P11A301-244) ----
    # 진동·bias 실측(TBD-HW-012) 전 임시값이다. 데이터시트 잡음 밀도만 보면
    # gyro는 3e-7 (rad/s)^2 수준이지만, 실제로는 차체 진동과 온도 bias 변동이
    # 지배하므로 보수적으로 (0.02 rad/s)^2 = 4e-4, accel은 (0.2 m/s^2)^2 = 4e-2로
    # 둔다.
    #
    # **2026-08-04 정지 실측(S15P11A301-236): gyro_z 표준편차 0.00715 rad/s →
    # 분산 5.1e-05.** 지금 값(4e-4)의 약 1/8 이다. 그래도 낮추지 않는다 — 이
    # 측정은 IMU 가 차체에 고정되지 않고 로봇이 정지한 조건이라, 위 주석이 지목한
    # 지배 항(차체 진동)이 빠져 있다. 낮추면 실차에서 IMU 를 과신한다.
    # **5.1e-05 는 하한이다.** 주행 로그로 재측정해 그 사이 값으로 확정한다
    # (S15P11A301-248).
    imu_angular_velocity_variance: 4.0e-04
    imu_linear_acceleration_variance: 4.0e-02
    # CALIBRATING·RANGE_ERROR·clock offset 미안정 구간에 싣는 값. 값은 Foxglove로
    # 보이되 EKF가 융합하지 않게 하는 것이 목적이다(Inf/NaN은 구독자를 깨뜨린다).
    imu_untrusted_variance: 1.0e+06
    # 보드 monotonic 시계 오프셋 재동기 주기(초). 창 길이 × 크리스털 드리프트가
    # 타임스탬프 오차 상한이다(10s·100ppm = 1ms).
    imu_clock_resync_period_s: 10.0

    # ---- HC-SR04 (sensor_task.cpp의 MIN/MAX_VALID_DISTANCE_CM과 맞출 것) ----
    range_min_m: 0.02
    range_max_m: 4.0
    range_field_of_view_rad: 0.26  # 데이터시트 유효 각도 약 15deg
