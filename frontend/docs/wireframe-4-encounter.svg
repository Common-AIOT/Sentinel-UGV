<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 619" width="1100" height="619" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    .dim{fill:#e4e9ed}
    .card{fill:#ffffff;stroke:#9fabb6;stroke-width:1.5}
    .box{fill:#e4e9ed;stroke:#c6ced5;stroke-width:1.2}
    .cell{fill:#ffffff;stroke:#c6ced5;stroke-width:1.1}
    .cellOn{fill:#fbeee6;stroke:#b0450d;stroke-width:1.3}
    .rule{stroke:#c6ced5;stroke-width:1}
    .edge{fill:none;stroke:#9fabb6;stroke-width:1.5}
    .t{fill:#5b6874;font-size:12px}
    .ts{fill:#8a95a0;font-size:10.5px}
    .tb{fill:#171d24;font-size:12px}
    .chip{fill:#ffffff;stroke:#9fabb6;stroke-width:1.2}
    .pin{fill:#b0450d}
    .pinT{fill:#ffffff;font-size:11px;font-weight:700;text-anchor:middle}
    .xline{stroke:#c6ced5;stroke-width:1.2}
  </style>
  <pattern id="dots4" width="11" height="11" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#d3d9de"/>
  </pattern>

  <!-- 뒤에 깔린 지도 화면 -->
  <rect class="dim" x="0" y="0" width="1100" height="619"/>
  <rect x="0" y="0" width="1100" height="619" fill="url(#dots4)"/>
  <text class="ts" x="20" y="26">임무 이력 화면 위에 겹쳐 뜬다 · 닫으면 지도로 되돌아간다</text>

  <!-- 겹침 카드 -->
  <rect class="card" x="242" y="68" width="616" height="482" rx="4"/>

  <!-- 헤더 -->
  <text class="tb" x="258" y="98">대화 완료</text>
  <text class="ts" x="322" y="98">· 발견 14:31:02</text>
  <rect class="chip" x="778" y="82" width="64" height="24" rx="3"/>
  <text class="t" x="810" y="98" text-anchor="middle">✕ 닫기</text>

  <!-- 영상 -->
  <rect class="box" x="258" y="114" width="584" height="329"/>
  <line class="xline" x1="258" y1="114" x2="842" y2="443"/>
  <line class="xline" x1="842" y1="114" x2="258" y2="443"/>
  <rect class="chip" x="452" y="266" width="196" height="26" rx="3"/>
  <text class="t" x="550" y="283" text-anchor="middle">이벤트 영상 (발견 전후 구간)</text>

  <!-- 소음 제거 토글 -->
  <rect class="chip" x="258" y="455" width="164" height="28" rx="3"/>
  <text class="tb" x="340" y="473" text-anchor="middle">🔊 소음 제거본으로 듣기</text>
  <text class="ts" x="434" y="466">제거본은 명료도 보조입니다. 원본이 증거이며</text>
  <text class="ts" x="434" y="480">두드림·신음 같은 비언어 소리는 사라질 수 있습니다.</text>

  <!-- 값 3×2 -->
  <rect class="cell" x="258" y="493" width="188" height="24" rx="2"/>
  <text class="ts" x="266" y="509">감지 인원</text>
  <text class="tb" x="438" y="509" text-anchor="end">2</text>

  <rect class="cell" x="456" y="493" width="188" height="24" rx="2"/>
  <text class="ts" x="464" y="509">상호작용</text>
  <text class="tb" x="636" y="509" text-anchor="end">14:31~14:32</text>

  <rect class="cell" x="654" y="493" width="188" height="24" rx="2"/>
  <text class="ts" x="662" y="509">영상 개수</text>
  <text class="tb" x="834" y="509" text-anchor="end">2</text>

  <rect class="cellOn" x="258" y="521" width="188" height="24" rx="2"/>
  <text class="ts" x="266" y="537">요구조자가 말한 인원</text>
  <text x="438" y="537" fill="#b0450d" font-size="12" font-weight="600" text-anchor="end">3명</text>

  <rect class="cellOn" x="456" y="521" width="188" height="24" rx="2"/>
  <text class="ts" x="464" y="537">무응답 인원</text>
  <text x="636" y="537" fill="#b0450d" font-size="12" font-weight="600" text-anchor="end">1명</text>

  <rect class="cellOn" x="654" y="521" width="188" height="24" rx="2"/>
  <text class="ts" x="662" y="537">종료 사유</text>
  <text x="834" y="537" fill="#b0450d" font-size="12" font-weight="600" text-anchor="end">정상 종료</text>

  <rect class="edge" x="0.75" y="0.75" width="1098.5" height="617.5"/>

  <!-- 핀 -->
  <g><circle class="pin" cx="231" cy="278" r="11"/><text class="pinT" x="231" y="282">1</text></g>
  <g><circle class="pin" cx="231" cy="469" r="11"/><text class="pinT" x="231" y="473">2</text></g>
  <g><circle class="pin" cx="869" cy="533" r="11"/><text class="pinT" x="869" y="537">3</text></g>
</svg>
