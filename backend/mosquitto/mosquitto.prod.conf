# 운영 Mosquitto 설정 (S15P11A301-103).
# 참고본: jetson/ros2_ws/src/sentinel_bridge/config/mosquitto.conf.example (S15P11A301-128)
#
# 리스너 두 개를 둔다.
#   1883  스프링 ↔ 브로커. 도커 네트워크 내부 전용이며 호스트에 publish 하지 않는다.
#   9001  젯슨. nginx 가 443 에서 TLS 를 종료하고 이 리스너로 WebSocket 을 전달한다.
#
# 8883(MQTT over TLS)은 두지 않는다. SSAFY 보안그룹이 표준 포트만 열어 8883 이 외부에서
# 도달하지 않는다(2026-07-28 실측: 8883·1883 timeout, 443·8080·8989 연결). 포트가 열리면
# 아래 주석 블록을 되살리고 인증서를 마운트하면 된다.

# 리스너마다 인증 설정을 따로 두려면 반드시 필요하다. 빼면 첫 리스너 설정이 전체에 적용된다.
per_listener_settings true

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 보안그룹이 8883 을 열면 사용한다. 인증서는 nginx 와 같은 Let's Encrypt 파일을 마운트한다.
#listener 8883
#allow_anonymous false
#password_file /mosquitto/config/passwd
#acl_file /mosquitto/config/acl
#cafile /mosquitto/certs/fullchain.pem
#certfile /mosquitto/certs/fullchain.pem
#keyfile /mosquitto/certs/privkey.pem

# presence 는 Retain 을 쓰므로 재시작 후에도 마지막 상태가 남아야 한다.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
