  <circle cx="470" cy="400" r="8" fill="#fbeee6" stroke="#b0450d" stroke-width="1.6"/>
  <circle cx="640" cy="250" r="8" fill="#fbeee6" stroke="#b0450d" stroke-width="1.6"/>
