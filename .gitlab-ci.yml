# GitLab CI/CD 파이프라인에서 사용할 단계와 실행 순서입니다.
# 같은 stage의 job은 Runner 여유가 있으면 병렬로 실행되고,
# 앞 stage의 필수 job이 성공해야 다음 stage로 넘어갑니다.
#
# 선언한 stage에는 모두 job이 있습니다. GitLab은 빈 stage를 조용히 건너뛰므로
# 예약만 해두면 파이프라인은 초록불인데 그 단계가 돌고 있다고 오해하게 됩니다
# (S15P11A301-125). 필요해질 때 job과 함께 추가합니다.
#
# deploy_jetson_manual은 삭제했습니다. SSAFY 망이 인바운드를 막아 GitLab
# Runner가 Jetson에 SSH로 붙을 수 없으므로 애초에 불가능한 경로입니다.
# 젯슨 배포는 사람이 젯슨에서 직접 합니다(15.5).
stages:
  - lint
  - test
  - package
  - deploy_ec2

# 별도 설정이 없는 모든 job에 공통으로 적용되는 기본 정책입니다.
default:
  # 더 최신 커밋의 파이프라인이 시작되면 기존 job을 안전하게 취소할 수 있음을 나타냅니다.
  # 실제 자동 취소 여부는 GitLab 프로젝트의 중복 파이프라인 자동 취소 설정에도 영향을 받습니다.
  interruptible: true
  retry:
    # 코드/테스트 실패가 아니라 Runner/API 인프라 문제일 때만 최대 2회 재시도합니다.
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure

# Runner에 남아 있는 작업 디렉터리나 부분 checkout을 사용하지 않고,
# 모든 job이 동일한 깨끗한 Git 작업 트리에서 시작하도록 합니다.
variables:
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx

# 파이프라인 자체를 생성할 조건입니다. 위에서부터 평가하며 하나라도 일치하면 생성됩니다.
workflow:
  # 새 파이프라인이 시작될 때 이전 파이프라인을 자동 취소할지 정합니다.
  # interruptible 인 job 만 취소하는 것이 기본 동작이고, default 블록이 모든 job 을
  # interruptible: true 로 두었으므로 사실상 파이프라인 전체가 취소 대상입니다.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Merge Request가 생성되거나 새 커밋으로 갱신될 때 실행합니다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # main/master 등 GitLab 프로젝트에 설정된 기본 브랜치에서 실행합니다.
    #
    # 기본 브랜치 파이프라인은 자동 취소하지 않습니다(S15P11A301-211).
    #
    # 배포 job 들의 rules 는 `기본 브랜치 + changes` 형태이고, changes 는 직전
    # 커밋(CI_COMMIT_BEFORE_SHA) 대비 diff 를 봅니다. 취소된 파이프라인의 커밋은
    # 다음 파이프라인의 비교 범위에 들어오지 않으므로, 그 변경은 **어느
    # 파이프라인에서도 배포되지 않습니다.**
    #
    # 2026-08-03 에 실제로 일어났습니다. 09:55 프런트엔드 머지의 파이프라인이
    # test:frontend(npm ci + tsc + next build) 실행 중이었고, 09:57 하드웨어 머지가
    # 그것을 취소했습니다. 09:57 머지는 frontend 파일이 0개라 deploy:frontend 가
    # changes 조건에 걸리지 않았습니다. 파이프라인은 초록이고 MR 은 머지됐고
    # 화면은 정상 렌더링되는데 배포만 없는 상태가 됩니다.
    #
    # MR·기능 브랜치는 위 규칙 그대로 취소합니다. 그쪽은 배포를 하지 않으므로
    # 연속 푸시에서 러너 시간을 아끼는 편이 맞습니다.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      auto_cancel:
        on_new_commit: none
    # GitLab의 Build > Pipelines > Run pipeline에서 수동으로 시작한 경우 실행합니다.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # 위 조건에 해당하지 않는 일반 기능 브랜치 push, 태그 push 등은 실행하지 않습니다.
    - when: never

# Runner가 GitLab의 job을 정상적으로 수신했고 필수 CI 변수가 제공되는지 확인합니다.
verify:runner:
  stage: lint
  # 가볍고 빠른 Linux 컨테이너에서 검증 명령을 실행합니다.
  image: alpine:3.20
  script:
    # test -n은 문자열이 비어 있으면 실패(exit code 1)합니다.
    - test -n "$CI_PIPELINE_ID"
    - test -n "$CI_COMMIT_SHA"
    - test -n "$CI_RUNNER_ID"
    # 문제 발생 시 어떤 Runner와 커밋이 실행됐는지 job 로그에서 확인할 수 있게 출력합니다.
    - echo "Runner ${CI_RUNNER_DESCRIPTION:-unknown} accepted pipeline ${CI_PIPELINE_ID}."
    - echo "Commit ${CI_COMMIT_SHORT_SHA} on ${CI_COMMIT_REF_NAME}."

# 프로젝트 필수 디렉터리와 필수 파일이 존재하며 비어 있지 않은지 검사합니다.
# 실제 검사 대상 목록은 scripts/ci/validate_repository.sh에서 관리합니다.
validate:repository-structure:
  stage: lint
  image: alpine:3.20
  script:
    - sh scripts/ci/validate_repository.sh

# ROS 노드가 구독·타이머·서비스에 넘긴 콜백이 실제로 정의돼 있는지 검사합니다
# (S15P11A301-226).
#
# cloud_bridge 가 develop 에서 기동 즉시 죽고 있었습니다. S15P11A301-193 이 다른
# 메서드를 추가하며 _on_candidates 를 덮어써 지웠는데 구독 등록은 남아
# AttributeError 가 났습니다.
#
# **아무 신호가 없었습니다.** 이 저장소의 파이썬 시험은 rclpy 를 import 하지 않는
# 모듈만 다루고(그것이 CI 에서 돌 수 있는 이유입니다), demo.launch.py 는 노드 하나가
# 죽어도 나머지를 계속 돌립니다(32장 장애 격리). 관제로 가는 telemetry 가 전부 끊긴
# 채로 스택이 정상으로 보였습니다.
#
# 타입 정보 없이 AST 로 잡을 수 있는 결함이라 rclpy 없는 컨테이너에서 돕니다.
validate:node-callbacks:
  stage: lint
  image: python:3.10-alpine
  script:
    - python scripts/ci/validate_node_callbacks.py

# URDF 링크 트리가 끊어지지 않았는지 검사합니다 (S15P11A301-349).
#
# S15P11A301-344 의 커밋이 주석 블록을 다시 쓰면서 그 아래 있던
# base_link_to_camera_link 조인트 4줄을 함께 지웠습니다. 새 주석의 닫는 --> 가
# 조인트를 삼켰고, 그 상태로 develop 에 병합됐습니다.
#
# **아무 신호가 없었습니다.** URDF 는 XML 로서 여전히 유효하고 링크 선언도 남아
# 있어 파일을 훑어보면 정상으로 보입니다. robot_state_publisher 는 끊어진 트리를
# 그대로 받아 기동하고, base_link -> camera_optical_frame 조회만 조용히 실패합니다.
# 그러면 사람 방위각을 지도 좌표로 옮기는 경로(04장 25.3)가 성립하지 않는데, 그
# 실패는 카메라 화면에도 지도에도 드러나지 않습니다.
#
# check_urdf 대신 표준 XML 파서로 검사합니다 - 그쪽은 liburdfdom-tools 가 필요해
# rclpy 없는 lint 컨테이너에서 돌지 않습니다.
validate:urdf-tree:
  stage: lint
  image: python:3.10-alpine
  script:
    - python scripts/ci/validate_urdf_tree.py

# 각 모듈이 자체 관리하는 Docker Compose 파일의 문법과 변수 치환을 검사합니다.
# config --quiet는 컨테이너를 실행하지 않고 최종 Compose 설정의 유효성만 확인합니다.
# 프런트엔드·Jetson 등 다른 모듈의 Compose 파일이 추가되면 아래 목록에 함께 등록합니다.
validate:compose-config:
  stage: lint
  # SHA-256 digest로 이미지를 고정해 같은 Docker CLI 버전을 재현 가능하게 사용합니다.
  image: docker:29-cli@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
  script:
    # 백엔드 로컬 개발용 Compose 설정을 검증합니다.
    - docker compose --file backend/compose.local.yaml config --quiet
    # 백엔드 EC2 배포용 Compose 설정을 검증합니다.
    - docker compose --file backend/compose.prod.yaml config --quiet

# 저장소의 셸 스크립트를 ShellCheck로 정적 분석합니다.
lint:shell:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    # 이미지의 기본 ENTRYPOINT를 제거해 GitLab Runner가 script 명령을 직접 실행하게 합니다.
    entrypoint: [""]
  script:
    # 일반 운영 스크립트와 CI 보조 스크립트를 모두 검사합니다.
    - shellcheck scripts/*.sh scripts/ci/*.sh

# 파이썬 린터 (S15P11A301-377).
#
# 파이썬 239개 파일에 린터가 없었습니다. 프런트만 `next build` 가 ESLint 를 돌려
# 강제되고, 파이썬은 아무도 보지 않아서 미사용 import 8건과 미사용 지역변수 1건이
# 남아 있었습니다.
#
# 규칙과 그 근거는 저장소 루트 `ruff.toml` 에 적습니다. 도입 시점에 위반 0으로
# 맞춰 두었으므로 **이 job 은 처음부터 초록불이어야 합니다** — 빨간불로 시작하면
# 아무도 보지 않습니다.
#
# 버전을 고정합니다. 린터가 올라가면서 새 규칙이 기본에 들어오면, 코드를 건드리지
# 않은 MR 이 갑자기 실패합니다. 올릴 때는 위반을 함께 정리하는 MR 로 올립니다.
lint:python:
  stage: lint
  image: python:3.10-alpine
  rules:
    - changes:
        - "**/*.py"
        - ruff.toml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - pip install --quiet ruff==0.16.2
  script:
    - ruff check .

# Runner 환경 문제를 조사할 때만 GitLab UI에서 수동 실행하는 진단 job입니다.
diagnose:runner:
  stage: lint
  image: alpine:3.20
  # 진단 자체가 실패해도 전체 파이프라인 상태를 실패로 변경하지 않습니다.
  allow_failure: true
  rules:
    # 자동 실행하지 않고 파이프라인 화면에 실행 버튼을 표시합니다.
    - when: manual
  script:
    # Runner 식별 정보와 컨테이너의 OS, 사용자 권한, 디스크 상태를 로그로 남깁니다.
    - echo "Description=${CI_RUNNER_DESCRIPTION:-unknown}"
    - echo "Architecture=${CI_RUNNER_EXECUTABLE_ARCH:-unknown}"
    - echo "Tags=${CI_RUNNER_TAGS:-none}"
    - uname -a
    - id
    - df -h

# 커밋 메시지가 docs/git_convention.md의 커밋 규칙을 따르는지 검사합니다.
#
# 커밋 타입은 짧은 형태(feat, docs, perf, refactor)로 통일했습니다. 브랜치
# 타입은 긴 형태(feature, documentation, ...)를 그대로 쓰므로 둘은 다릅니다.
# 검사가 없던 동안 두 형태가 이력에 반반 섞였습니다(S15P11A301-125).
lint:commit-message:
  stage: lint
  image: alpine:3.20
  rules:
    # MR에 담긴 커밋만 검사합니다. 기본 브랜치는 이미 병합된 이력이므로
    # 지금 고칠 수 없는 과거 커밋 때문에 파이프라인이 계속 빨간불이 됩니다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache git
  script:
    - |
      types="feat|fix|hardware|refactor|perf|test|docs|style|build|chore|ci|hotfix|revert"
      # MR의 대상 브랜치와의 공통 조상 이후 커밋만 대상으로 합니다.
      git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      base=$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")
      failed=0
      # --no-merges가 필요합니다. 대상 브랜치를 작업 브랜치로 가져오면 머지
      # 커밋이 생기는데, 그 메시지는 GitLab이 만들어 규칙을 따를 수 없습니다.
      while IFS= read -r subject; do
        [ -n "$subject" ] || continue
        # 형식: <type>(<scope>): <jira-key> <한국어 설명>
        if ! echo "$subject" | grep -qE "^($types)\([a-z0-9-]+\): S15P11A301-[0-9]+ .+"; then
          echo "규칙에 맞지 않는 커밋 메시지: $subject" >&2
          failed=1
        fi
      done <<EOF
      $(git log --no-merges --format=%s "$base..HEAD")
      EOF
      if [ "$failed" -ne 0 ]; then
        echo "" >&2
        echo "형식: <type>(<scope>): S15P11A301-<번호> <한국어 설명>" >&2
        echo "허용 type: $types" >&2
        echo "  브랜치는 긴 형태(feature, documentation)를 쓰지만" >&2
        echo "  커밋은 짧은 형태(feat, docs)입니다. 둘은 다릅니다." >&2
        echo "docs/git_convention.md 를 참고하세요." >&2
        exit 1
      fi
      echo "커밋 메시지 검사 통과."

# 프런트엔드 타입 검사와 프로덕션 빌드입니다.
#
# 이 job이 없던 동안 사람이 커밋 전에 직접 tsc와 next build를 돌리고 있었습니다.
# deploy:frontend가 기본 브랜치에서 Vercel 프로덕션으로 바로 배포하므로,
# 게이트가 없으면 실패를 배포 시점에야 알게 됩니다(S15P11A301-125).
test:frontend:
  stage: test
  image: node:20-alpine
  rules:
    - changes:
        - frontend/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    # 단위 시험(vitest)은 S15P11A301-223에서 붙였습니다. tsc 와 next build 는
    # 타입과 빌드만 보므로, 지도 좌표 변환처럼 **틀려도 화면이 정상으로 보이는**
    # 로직은 아무것도 잡지 못합니다. 시험을 앞에 두는 이유는 훨씬 빨라 실패를
    # 먼저 알리기 때문입니다.
    - npm test
    - npx tsc --noEmit
    - npx next build

# 백엔드 컴파일과 메시지 계약 검증입니다 (S15P11A301-103).
#
# 이미지 빌드(DinD)는 넣지 않습니다. Dockerfile 이 안에서 gradle 빌드를 하므로
# 컴파일이 깨지면 어차피 build:backend-image 에서 실패하고, 그 job 은 기본 브랜치에서만
# 돕니다. 여기서 컴파일만 확인하면 MR 단계에서 같은 실패를 훨씬 싸게 잡습니다.
#
# MessageContractTest 는 common/samples 예제를 백엔드 DTO 로 직접 파싱합니다.
# test:message-contract 가 Python 쪽만 검사하므로 Java 쪽 구멍을 이 테스트가 막습니다.
#
# **PostgreSQL 서비스를 띄웁니다** (S15P11A301-355). 종전에는 "DB 가 필요한 테스트는
# 없다"며 서비스를 두지 않았고, 그 대신 `--tests '*ContractTest'` 로 DB 없이 도는
# 것만 골라 돌렸습니다. 그래서 **`@SpringBootTest` 인 BackendApplicationTests
# (contextLoads)가 한 번도 실행되지 않았습니다** — 즉 "앱이 실제로 뜨는가" 를 CI 가
# 검사한 적이 없습니다.
#
# 2026-08-09 그 구멍으로 기동 실패가 프로덕션까지 갔습니다. RobotStateWriter 에
# 생성자가 하나 늘어 스프링이 고르지 못하게 됐는데, 컴파일은 통과하고 계약 시험도
# 통과해 파이프라인이 초록불이었습니다. contextLoads 하나면 MR 에서 잡혔을 일입니다.
#
# 이미지는 **운영과 같은 TimescaleDB** 여야 합니다. V1__init_schema.sql 이
# `CREATE EXTENSION timescaledb` 와 `create_hypertable()` 을 부르므로 평범한
# postgres 이미지로는 Flyway 가 실패하고, 그러면 contextLoads 가 진짜 원인이 아닌
# 이유로 빨간불이 됩니다.
test:backend:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  services:
    - name: timescale/timescaledb:latest-pg15
      alias: postgres
  rules:
    - changes:
        - backend/**/*
        - common/schemas/**/*
        - common/samples/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key:
      files:
        - backend/build.gradle
    paths:
      - backend/.gradle/
  variables:
    # 서비스 컨테이너가 읽는 값. 시험 전용이라 비밀이 아니고 CI 변수로 뺄 이유가 없다.
    POSTGRES_DB: sentinel_ugv
    POSTGRES_USER: sentinel
    POSTGRES_PASSWORD: sentinel
    # 앱이 읽는 값. application-local.yml 의 기본값을 이것들이 덮는다(profile 은 local).
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sentinel_ugv
    SPRING_DATASOURCE_USERNAME: sentinel
    SPRING_DATASOURCE_PASSWORD: sentinel
    # S3Config 가 AwsBasicCredentials 를 만드는데 SDK 가 빈 자격증명을 거부한다.
    # 기본값(`${S3_SECRET_KEY:}`)이 빈 문자열이라 두면 contextLoads 가 DB 와 무관한
    # 이유로 죽는다. 아무 값이나 있으면 되고, 시험은 스토리지에 접속하지 않는다.
    S3_ACCESS_KEY: ci-dummy
    S3_SECRET_KEY: ci-dummy
  before_script:
    # 서비스 컨테이너의 준비를 기다린다. GitLab 은 서비스가 뜰 때까지 기다려 주지 않는다.
    # gradle 컴파일이 보통 더 오래 걸려 없어도 대개 통과하지만, 그것은 타이밍에 기댄
    # 것이고 언젠가 간헐 실패로 돌아온다.
    - apk add --no-cache postgresql-client
    - timeout 60 sh -c 'until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done'
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew --no-daemon bootJar -x test
    # **이름으로 고르지 않는다** (S15P11A301-355). 종전 `--tests '*ContractTest'` 는
    # 두 번 같은 함정을 만들었다 — S15P11A301-288 의 ServerPublishContractTest 가
    # 패턴에 안 맞아 빠졌고, S15P11A301-346 의 RobotStateWriterTest 도 같은 이유로
    # 빠졌다. 패턴을 넓히는 것으로는 끝나지 않는다. 새 시험은 계속 생기고 이름은
    # 계속 다르다.
    #
    # 시험을 만들어 놓고 돌지 않는 것이 없는 것보다 나쁘다(검사한다고 믿게 된다).
    # 이제 전부 돌린다. DB 가 붙었으므로 contextLoads 도 여기 포함된다.
    - ./gradlew --no-daemon test
    # Java 린터 (S15P11A301-377). 별도 job 으로 두지 않는 이유는 JDK 와 gradle
    # 캐시를 여기서 이미 받았기 때문이다 — lint stage 에 두면 같은 것을 두 번 받는다.
    # 규칙과 근거는 backend/config/checkstyle/checkstyle.xml.
    - ./gradlew --no-daemon checkstyleMain checkstyleTest

# Dockerfile 자체의 오류를 MR 단계에서 잡습니다 (S15P11A301-130).
#
# test:backend 가 컴파일을 이미 검증하므로, DinD 빌드는 Dockerfile 이 바뀐
# MR 로 한정합니다. 푸시는 하지 않습니다.
#
# merged results 파이프라인에서는 CI_COMMIT_SHORT_SHA 가 임시 병합 커밋을
# 가리켜 소스 커밋으로 역산할 수 없습니다(그 경우 CI_MERGE_REQUEST_SOURCE_BRANCH_SHA
# 를 써야 합니다). 여기서는 푸시하지 않으므로 태그는 검증용 고정 문자열입니다.
test:backend-dockerfile:
  stage: test
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/Dockerfile
  script:
    # DinD 데몬 대기 — build:backend-image 와 같은 기동 플레이크 대응.
    # retry 는 두지 않는다. 이 job 은 Dockerfile 실수를 잡는 것이 목적이라
    # script 실패를 자동 재시도하면 진짜 실패까지 세 번 돌게 된다.
    - timeout 90 sh -c 'until docker info >/dev/null 2>&1; do sleep 3; done'
    - cd backend
    - docker build -t spring-backend:mr-check .

# 공통 메시지 계약 검증입니다 (S15P11A301-128).
#
# 명세 31-12가 이 검사를 요구합니다. "Python과 Java가 같은 JSON 계약을 사용하도록
# common/schemas에 JSON Schema를 두고 CI에서 예제 메시지를 검증한다."
#
# 젯슨(Python)과 백엔드(Java)가 같은 봉투를 쓰는지 확인할 유일한 장치입니다.
# 한쪽이 필드명을 바꾸면 여기서 잡히지 않으면 런타임에야 터집니다.
#
# ROS는 필요하지 않습니다. 계약을 다루는 모듈이 rclpy를 import하지 않도록 만들었기
# 때문에 x86 Runner에서도 돕니다. 노드 파일(`*_node.py`)만 rclpy를 씁니다.
#
# 시험이 노드 파일에서 무언가를 가져오면 이 job이 ModuleNotFoundError로 깨집니다.
# 실제로 그렇게 깨진 적이 있습니다(S15P11A301-135). 계약에 쓰는 상수·함수는
# rclpy 없는 모듈(message_mapper, mission_state, segment_store)에 둡니다.
#
# 푸시 전에 로컬에서 이 job을 그대로 돌립니다.
#
#   ./scripts/ci/run_contract_tests.sh
#
# 젯슨에서 그냥 pytest를 돌리면 통과하는데 CI에서 깨지는 일이 반복됐습니다. 젯슨은
# ROS가 source돼 있어 rclpy가 보이고 시스템 파이썬에 requests도 깔려 있는데, CI
# 컨테이너에는 둘 다 없습니다. 위 스크립트가 전용 venv와 `env -i`로 그 차이를
# 없애 줍니다.
# 탐사·접근 순수 모듈 시험 (S15P11A301-172·247). numpy 가 필요해서 contract 잡(alpine —
# musl 이라 numpy 휠이 없다)에 넣지 못하고 slim 이미지로 따로 돈다.
test:exploration:
  stage: test
  image: python:3.10-slim
  rules:
    - changes:
        - jetson/ros2_ws/src/sentinel_exploration/**/*
        # 접근(S15P11A301-247)도 여기서 돈다. numpy 는 안 쓰지만 순수 모듈 시험이라
        # 성격이 같고, job 을 하나 더 만들면 같은 이미지를 두 번 받는다.
        - jetson/ros2_ws/src/sentinel_approach/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - pip install --quiet numpy pytest
  script:
    - python -m pytest jetson/ros2_ws/src/sentinel_exploration/test -q
    - python -m pytest jetson/ros2_ws/src/sentinel_approach/test -q

# ai/detection 의 순수 모듈 시험 (S15P11A301-329).
#
# 이 잡이 없어서 탐지 쪽 시험 33 건이 아무 데서도 돌지 않고 있었다. 파이프라인
# 본체는 ultralytics·torch·cv2 를 끌어오므로 CI 에서 돌릴 수 없지만, 판정 로직을
# 순수 모듈로 빼 둔 것들은 표준 라이브러리와 pytest 만으로 돈다 —
# sentinel_exploration 이나 link_health.py 와 같은 성격이다.
#
# test_posture_persistence.py 는 제외한다. src.pipeline 을 import 해
# ultralytics 가 필요하고, 그것을 slim 이미지에 넣으면 torch 까지 따라와
# 잡 하나가 수 분·수 GB 가 된다. 그 파일은 Jetson 에서 손으로 돌린다.
test:detection:
  stage: test
  image: python:3.10-alpine
  rules:
    - changes:
        - ai/detection/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - pip install --quiet pytest
  script:
    - cd ai/detection
    - python -m pytest tests/test_model_backend.py tests/test_candidates.py
      tests/test_event_image_retention.py -q

test:message-contract:
  stage: test
  image: python:3.10-alpine
  rules:
    - changes:
        - common/schemas/**/*
        - common/samples/**/*
        - jetson/ros2_ws/src/esp32_bridge/**/*
        - jetson/ros2_ws/src/sentinel_bridge/**/*
        - jetson/ros2_ws/src/sentinel_drive/**/*
        - jetson/ros2_ws/src/sentinel_mission/**/*
        - jetson/ros2_ws/src/sentinel_recorder/**/*
        - jetson/ros2_ws/src/sentinel_safety/**/*
        - jetson/ros2_ws/src/sentinel_streaming/**/*
        - scripts/ci/contract-test-requirements.txt
        - scripts/ci/run_contract_tests.sh
        - scripts/ci/validate_schemas.py
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    # 패키지 목록을 여기 인라인으로 적지 않습니다. 로컬 스크립트가 같은 파일을
    # 읽어야 두 환경이 갈라지지 않습니다. 갈라져서 CI를 두 번 깼습니다.
    - pip install --quiet -r scripts/ci/contract-test-requirements.txt
  script:
    # 1. 스키마 자체와 예제 메시지
    - python scripts/ci/validate_schemas.py
    # 2. 코드가 만드는 메시지가 그 스키마를 통과하는지.
    #    예제 파일 검증만으로는 구현이 어긋나도 통과한다.
    #
    #    패키지를 각각 지정합니다. 최상위에서 pytest를 돌리면 rclpy가 필요한
    #    다른 디렉터리까지 수집해 실패합니다.
    - python -m pytest jetson/ros2_ws/src/sentinel_bridge/test -q
    - python -m pytest jetson/ros2_ws/src/sentinel_drive/test -q
    - python -m pytest jetson/ros2_ws/src/sentinel_mission/test -q
    - python -m pytest jetson/ros2_ws/src/sentinel_recorder/test -q
    # sentinel_streaming은 ring_buffer만 시험합니다. 파이프라인 문자열을 만드는
    # 순수 모듈이라 gi도 rclpy도 필요 없습니다. 나머지 스트리밍 코드는 GStreamer
    # 요소를 다루므로 젯슨에서만 검증합니다.
    - python -m pytest jetson/ros2_ws/src/sentinel_streaming/test -q
    # esp32_bridge 137건·sentinel_safety 29건은 이 잡이 생긴 뒤로도 빠져 있었다
    # (S15P11A301-377). 안전 게이트·명령 먹스·시리얼 프레이밍·CRC 가 어느 job
    # 에서도 돌지 않았다. 두 패키지의 시험 파일은 rclpy 를 import 하지 않으므로
    # 위 다섯과 조건이 같다 — 실측 0.46초, 보드도 ROS도 필요 없다.
    # esp32_bridge 만 pyserial 이 필요하다(요구 파일 참고).
    - python -m pytest jetson/ros2_ws/src/esp32_bridge/test -q
    - python -m pytest jetson/ros2_ws/src/sentinel_safety/test -q

# ROS 2 패키지의 colcon 빌드는 CI에 넣지 않습니다. Runner가 x86이면
# nvv4l2decoder와 usb_cam 패치, Tegra 전용 요소를 다룰 수 없어 CI 통과가
# Jetson 동작을 보장하지 못합니다. 파이프라인만 느려집니다.
#
# 백엔드 단위 테스트는 백엔드 담당자가 test stage에 추가합니다.
# 현재 job에는 tags가 없으므로 Runner 설정에서 "Run untagged jobs"가 활성화되어야 합니다.

# 백엔드 도커 이미지 빌드 및 도커 허브 업로드 (Push)
build:backend-image:
  stage: package
  image: docker:24.0.5
  services:
    # Docker CLI가 비TLS DinD 데몬(2375)에 연결하도록 양쪽 설정을 맞춘다.
    # 이 job을 실행하는 Docker executor Runner에는 config.toml의
    # [runners.docker] privileged = true 설정도 필요하다.
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    # DinD 서비스가 TLS 없이 실행되도록 설정 (빈 문자열 = TLS 비활성화)
    DOCKER_TLS_CERTDIR: ""
    # Docker 클라이언트가 DinD 서비스의 비-TLS 포트로 접속하도록 지정
    DOCKER_HOST: tcp://docker:2375
  # DinD 서비스가 가끔 기동 중 죽는다(zombie 네트워크 경고 → 2375 무응답 →
  # "Cannot connect to the Docker daemon"). 기본 retry 는 script_failure 를
  # 재시도하지 않아 매번 사람이 재실행했다. 이 job 의 코드 실패는 MR 단계
  # (test:backend·test:backend-dockerfile)가 먼저 잡으므로, 기본 브랜치에서의
  # script 실패는 사실상 러너 인프라 문제다 — 자동 재시도가 안전하다.
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  script:
    # 0. DinD 데몬 대기 — 러너 헬스체크(30초)보다 늦게 뜨는 경우를 흡수한다.
    #    끝내 안 뜨면 여기서 실패하고, 위 retry 가 새 서비스 컨테이너로 재시도한다.
    - timeout 90 sh -c 'until docker info >/dev/null 2>&1; do sleep 3; done'

    # 1. 도커 허브 로그인 (GitLab Variables에 등록한 변수 사용)
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin

    # 2. 백엔드 폴더로 이동
    - cd backend

    # 3. 깃랩 시크릿(File 타입)에서 application-prod.yml을 가져와서 리소스 폴더에 생성
    - cp $APPLICATION_PROD_YML src/main/resources/application-prod.yml

    # 4. 이미지 빌드 및 푸시 (S15P11A301-130)
    #    커밋 SHA 태그로 고정해 배포·롤백이 커밋 단위로 추적되게 합니다.
    #    latest 는 .env 의 DOCKER_IMAGE 가 없을 때의 수동 fallback 용으로만 함께 밉니다.
    - docker build -t $DOCKER_HUB_USER/spring-backend:$CI_COMMIT_SHORT_SHA -t $DOCKER_HUB_USER/spring-backend:latest .
    - docker push $DOCKER_HUB_USER/spring-backend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_HUB_USER/spring-backend:latest
  rules:
    # 기본 브랜치에서만 실행합니다. backend 폴더가 바뀐 경우로 한정합니다.
    #
    # 이전에는 브랜치 조건이 없어서 MR 파이프라인에서도 실행됐습니다.
    # workflow:rules가 merge_request_event를 허용하므로, backend/를 건드린 MR을
    # 올리면 머지 전 코드가 :latest 태그로 Docker Hub에 올라가고 deploy:ec2가
    # 그것을 프로덕션에 배포했습니다(S15P11A301-127).
    #
    # :latest는 가변 태그이므로 MR이 덮어쓰면, 이후 기본 브랜치에서 도는
    # deploy:ec2가 MR의 이미지를 배포할 수도 있었습니다.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
    # 사용자가 수동으로 파이프라인을 실행했을 때도 동작하도록 허용
    - if: '$CI_PIPELINE_SOURCE == "web"'

# EC2 서버 자동 배포
deploy:ec2:
  stage: deploy_ec2
  image: alpine:3.20
  needs: ["build:backend-image"] # 빌드가 성공해야만 배포 실행
  # 이 배포는 한 번에 하나만 돕니다(S15P11A301-211). 기본 브랜치 파이프라인의
  # 자동 취소를 끄면서 두 파이프라인이 동시에 살아 있을 수 있게 됐고, 그러면
  # docker compose pull && up -d 가 겹쳐 컨테이너가 두 번 재시작됩니다.
  resource_group: ec2-production
  before_script:
    # SSH 접속을 위한 패키지 설치 및 키 세팅
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    # 1. EC2 배포용 디렉토리 생성
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/deploy"

    # 1-1. 지금 돌고 있는 이미지를 기억한다 (S15P11A301-355).
    #      아래 2-1 이 .env 를 통째로 덮으므로 **그 전에** 읽어야 한다. 4 단계에서
    #      기동에 실패하면 이 값으로 되돌린다.
    #      첫 배포라 .env 가 없으면 빈 값이고, 그때는 되돌릴 곳이 없으므로 실패만 알린다.
    - PREV_IMAGE=$(ssh $EC2_USER@$EC2_HOST "grep '^DOCKER_IMAGE=' ~/deploy/.env 2>/dev/null | tail -1 | cut -d= -f2-" || true)
    - echo "직전 이미지 = ${PREV_IMAGE:-(없음)}"

    # 2. 실행 파일(compose.prod.yaml) 전송
    - scp backend/compose.prod.yaml $EC2_USER@$EC2_HOST:~/deploy/compose.prod.yaml

    # 2-1. 환경변수(.env)를 러너에서 조립해 전송 — 배포 이미지를 이 파이프라인의
    #      커밋 SHA 로 고정합니다 (S15P11A301-130). ENV_PROD 에 DOCKER_IMAGE 가 있어도
    #      삭제 후 추가라 멱등이고, printf 의 선행 개행은 ENV_PROD 끝에 개행이 없을 때
    #      마지막 줄에 이어붙는 사고를 막습니다 (dotenv 는 빈 줄을 무시합니다).
    - cp $ENV_PROD env.deploy
    - sed -i '/^DOCKER_IMAGE=/d' env.deploy
    - printf '\nDOCKER_IMAGE=%s/spring-backend:%s\n' "$DOCKER_HUB_USER" "$CI_COMMIT_SHORT_SHA" >> env.deploy
    - scp env.deploy $EC2_USER@$EC2_HOST:~/deploy/.env

    # 2-2. MQTT 브로커 설정과 ACL 전송 (S15P11A301-103)
    # 계정 비밀번호 파일(passwd)은 전송하지 않는다. 비밀이므로 EC2 에서 한 번 생성해
    # 그대로 유지한다. 절차는 docs/private-docs/mqtt-setup.md 를 따른다.
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/deploy/mosquitto"
    - scp backend/mosquitto/mosquitto.prod.conf $EC2_USER@$EC2_HOST:~/deploy/mosquitto/mosquitto.conf
    - scp backend/mosquitto/acl $EC2_USER@$EC2_HOST:~/deploy/mosquitto/acl

    # 3. EC2 접속 후 고정된 이미지 Pull 및 컨테이너 재시작
    - ssh $EC2_USER@$EC2_HOST "cd ~/deploy && docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d"

    # 4. 앱이 실제로 떴는지 확인하고, 아니면 되돌린다 (S15P11A301-355).
    #
    #    `docker compose up -d` 는 **컨테이너를 띄우는 데 성공하면 0 을 반환한다.**
    #    그 안의 앱이 죽어도 상관하지 않는다. 2026-08-09 에 기동 실패한 이미지가
    #    배포됐는데 파이프라인은 초록불이었고, 관제 화면이 「오프라인」인 것을 사람이
    #    보고서야 알았다. 그동안 컨테이너는 `restart: always` 로 40분간 재시작만 반복했다.
    #
    #    90초를 기다린다(3초 × 30회). 실측 기동은 25초 안팎이고, EC2 가 느린 날의
    #    여유까지 본 값이다.
    - |
      if ssh $EC2_USER@$EC2_HOST "for i in \$(seq 1 30); do curl -fsS --max-time 3 localhost:8080/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' && exit 0; sleep 3; done; exit 1"; then
        echo "기동 확인 — /actuator/health = UP"
      else
        echo "기동 실패 — 90초 안에 UP 이 되지 않았다. 아래는 백엔드 로그 마지막 40줄이다."
        ssh $EC2_USER@$EC2_HOST "cd ~/deploy && docker compose -f compose.prod.yaml logs --tail=40 backend" || true
        if [ -n "$PREV_IMAGE" ]; then
          echo "직전 이미지로 되돌린다: $PREV_IMAGE"
          ssh $EC2_USER@$EC2_HOST "cd ~/deploy && sed -i 's|^DOCKER_IMAGE=.*|DOCKER_IMAGE=$PREV_IMAGE|' .env && docker compose -f compose.prod.yaml up -d"
        else
          echo "되돌릴 직전 이미지를 알 수 없다(.env 가 없었다). 손으로 확인해야 한다."
        fi
        # Job 을 실패로 끝낸다. 초록불이 뜨면 아무도 배포가 깨진 것을 모른다.
        exit 1
      fi
  rules:
    # build:backend-image와 동일한 조건입니다.
    #
    # 이전 주석은 "default branch 조건은 workflow:rules에서 이미 관리하므로
    # 여기서 제거"라고 적혀 있었습니다. workflow:rules는 merge_request_event도
    # 허용하므로 그 전제가 성립하지 않습니다. 같은 파일의 deploy:frontend는
    # 처음부터 기본 브랜치 조건을 명시하고 있었습니다(S15P11A301-127).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# 프런트엔드 Vercel 자동 배포
# GitLab이 self-host라 Vercel Git 연동 대신 CLI를 토큰으로 호출해 배포한다.
# 프로젝트 식별자(VERCEL_ORG_ID/VERCEL_PROJECT_ID)와 토큰(VERCEL_TOKEN)은
# GitLab CI/CD Variables로 주입한다(.vercel 디렉터리는 커밋하지 않음).
deploy:frontend:
  stage: deploy_ec2
  image: node:20-alpine
  # deploy:ec2 와 같은 이유입니다(S15P11A301-211). 배포가 겹치면 늦게 시작한
  # 것이 먼저 끝날 수 있고, 그때 운영 별칭이 예전 커밋을 가리킨 채 남습니다.
  resource_group: vercel-production
  script:
    - cd frontend
    # VERCEL_ORG_ID/VERCEL_PROJECT_ID는 env로 자동 인식, 인증은 --token 사용
    - npx vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes
  rules:
    # 기본 브랜치에 frontend 변경이 반영될 때만 운영 배포
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
    # 웹에서 수동 실행 시에도 허용
    - if: '$CI_PIPELINE_SOURCE == "web"'
