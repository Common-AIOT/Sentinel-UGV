spring:
  docker:
    compose:
      # 실행 위치(레포 루트 vs backend)에 따라 상대경로가 깨져 기동 실패의 원인이 됐다.
      # 로컬 컨테이너는 compose 로 직접 관리한다: docker compose -f compose.local.yaml up -d
      enabled: false
  config:
    # 로컬 전용 비밀값. backend/.env.local 은 gitignore 대상이며, 없어도 기동한다(optional).
    # S3_SECRET_KEY 등 ${...} 플레이스홀더가 이 파일에서 풀린다.
    # 실행 위치가 레포 루트(IntelliJ)든 backend(gradlew)든 찾도록 두 경로를 모두 시도한다.
    import:
      - optional:file:.env.local[.properties]
      - optional:file:backend/.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel_ugv}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  s3:
    # 로컬·CI 기본값. **운영 주소를 기본값으로 두지 않는다** — 공통 파일에 두었더니
    # 주입이 빠졌을 때 운영 스토리지를 가리켰다(application.yml 주석 참고).
    #
    # compose.local.yaml 에는 MinIO 가 없으므로 실제 업로드는 되지 않는다. 기동과
    # 시험을 통과시키기 위한 값이다 — SDK 가 빈 자격증명을 거부해서 값이 아예
    # 없으면 contextLoads 가 스토리지와 무관한 이유로 죽는다.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:sentinel-ugv-assets}
    access-key: ${S3_ACCESS_KEY:local-dev}
    secret-key: ${S3_SECRET_KEY:local-dev-secret}
