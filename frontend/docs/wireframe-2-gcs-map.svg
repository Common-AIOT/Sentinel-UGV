<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 619" width="1100" height="619" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    .bg{fill:#ffffff}
    .panel{fill:#eef1f4}
    .box{fill:#e4e9ed;stroke:#c6ced5;stroke-width:1.2}
    .rule{stroke:#c6ced5;stroke-width:1}
    .edge{fill:none;stroke:#9fabb6;stroke-width:1.5}
    .t{fill:#5b6874;font-size:12px}
    .ts{fill:#8a95a0;font-size:10.5px}
    .tb{fill:#171d24;font-size:12px}
    .lbl{fill:#8a95a0;font-size:9.5px;letter-spacing:1.2px}
    .big{fill:#171d24;font-size:17px;font-weight:600}
    .chip{fill:#ffffff;stroke:#9fabb6;stroke-width:1.2}
    .pin{fill:#b0450d}
    .pinT{fill:#ffffff;font-size:11px;font-weight:700;text-anchor:middle}
    .xline{stroke:#c6ced5;stroke-width:1.2}
  </style>
  <pattern id="dots2" width="11" height="11" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#c6ced5"/>
  </pattern>

  <rect class="bg" x="0" y="0" width="1100" height="619"/>

  <!-- 상단 바 -->
  <rect class="panel" x="0" y="0" width="1100" height="34"/>
  <line class="rule" x1="0" y1="34" x2="1100" y2="34"/>
  <circle cx="18" cy="17" r="4" fill="#b0450d"/>
  <text class="tb" x="30" y="21">SENTINEL-UGV</text>
  <circle cx="880" cy="17" r="3.5" fill="#3f8f5f"/>
  <text class="t" x="892" y="21">관제 서버 연결됨</text>
  <text class="t" x="1000" y="21">14:32:07 UTC+9</text>

  <!-- 좌측 내비 -->
  <rect class="panel" x="0" y="34" width="46" height="585"/>
  <line class="rule" x1="46" y1="34" x2="46" y2="619"/>
  <rect x="0" y="42" width="46" height="38" fill="#fbeee6"/>
  <rect x="0" y="42" width="2.5" height="38" fill="#b0450d"/>
  <circle cx="23" cy="56" r="6" fill="none" stroke="#b0450d" stroke-width="1.4"/>
  <text x="23" y="74" fill="#b0450d" font-size="10" text-anchor="middle">관제</text>
  <rect x="17" y="90" width="12" height="12" fill="none" stroke="#8a95a0" stroke-width="1.4" rx="2"/>
  <text class="ts" x="23" y="116" text-anchor="middle">이력</text>

  <!-- 주 화면: 지도 -->
  <rect class="box" x="56" y="60" width="847" height="476"/>
  <rect x="57" y="61" width="845" height="474" fill="url(#dots2)"/>
  <rect class="chip" x="330" y="284" width="300" height="26" rx="3"/>
  <text class="t" x="480" y="301" text-anchor="middle">SLAM 실시간 지도 · 로봇 위치 · 목표 지정</text>

  <!-- 하단 명령 바 (수동) -->
  <line class="rule" x1="46" y1="561" x2="913" y2="561"/>
  <rect class="panel" x="46" y="561" width="867" height="58"/>
  <text class="big" x="62" y="587">수동 조종</text>
  <text class="ts" x="62" y="603">수동</text>
  <text class="t" x="190" y="595">모바일 앱에서 조종합니다 · 자율 명령을 내리려면 「자율」로 되돌리세요</text>

  <rect class="chip" x="790" y="578" width="92" height="26" rx="3"/>
  <rect x="836" y="578" width="46" height="26" fill="#d5dce1"/>
  <line class="rule" x1="836" y1="578" x2="836" y2="604"/>
  <text class="ts" x="813" y="595" text-anchor="middle" font-size="11">자율</text>
  <text class="tb" x="859" y="595" text-anchor="middle" font-size="11">수동</text>

  <!-- 우측 사이드바 -->
  <rect class="panel" x="913" y="34" width="187" height="585"/>
  <line class="rule" x1="913" y1="34" x2="913" y2="619"/>

  <!-- 영상 슬롯 -->
  <rect x="913" y="34" width="187" height="105" fill="#e4e9ed"/>
  <line class="xline" x1="913" y1="34" x2="1100" y2="139"/>
  <line class="xline" x1="1100" y1="34" x2="913" y2="139"/>
  <rect class="chip" x="957" y="74" width="98" height="24" rx="3"/>
  <text class="t" x="1006" y="90" text-anchor="middle">실시간 영상</text>
  <line class="rule" x1="913" y1="139" x2="1100" y2="139"/>

  <!-- 센서 -->
  <text class="lbl" x="925" y="160">센서</text>
  <text class="t" x="925" y="180">온도</text>
  <text class="tb" x="1088" y="180" text-anchor="end">24.1 °C</text>
  <text class="t" x="925" y="200">습도</text>
  <text class="tb" x="1088" y="200" text-anchor="end">38 %</text>
  <line class="rule" x1="913" y1="216" x2="1100" y2="216"/>

  <!-- 주행 -->
  <text class="lbl" x="925" y="235">주행</text>
  <text class="t" x="925" y="255">속도</text>
  <text class="tb" x="1088" y="255" text-anchor="end">0.00 m/s</text>
  <text class="t" x="925" y="275">회전 속도</text>
  <text class="tb" x="1088" y="275" text-anchor="end">0.00 rad/s</text>

  <rect class="edge" x="0.75" y="0.75" width="1098.5" height="617.5"/>

  <!-- 핀 -->
  <g><circle class="pin" cx="300" cy="180" r="11"/><text class="pinT" x="300" y="184">1</text></g>
  <g><circle class="pin" cx="902" cy="86" r="11"/><text class="pinT" x="902" y="90">2</text></g>
  <g><circle class="pin" cx="700" cy="551" r="11"/><text class="pinT" x="700" y="555">3</text></g>
</svg>
