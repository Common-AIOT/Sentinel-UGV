<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 576" width="1240" height="576" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    .bg{fill:#ffffff}
    .zone{fill:#f4f6f8;stroke:#c6ced5;stroke-width:1.2}
    .box{fill:#ffffff;stroke:#9fabb6;stroke-width:1.2}
    .boxk{fill:#fdf3ec;stroke:#b0450d;stroke-width:1.4}
    .edge{fill:none;stroke:#9fabb6;stroke-width:1.6}
    .edgek{fill:none;stroke:#b0450d;stroke-width:1.8}
    .zt{fill:#8a95a0;font-size:11px;letter-spacing:1.1px}
    .t{fill:#171d24;font-size:12.5px}
    .ts{fill:#5b6874;font-size:10.5px}
    .el{fill:#5b6874;font-size:11px}
    .elk{fill:#b0450d;font-size:11px;font-weight:600}
    .cap{fill:#8a95a0;font-size:10.5px}
  </style>

  <rect class="bg" x="0" y="0" width="1240" height="576"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fabb6"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#9fabb6"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0450d"/>
    </marker>
    <marker id="aks" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#b0450d"/>
    </marker>
  </defs>

  <!-- ===== 센서 ===== -->
  <rect class="zone" x="20" y="40" width="172" height="168" rx="4"/>
  <text class="zt" x="34" y="62">센서</text>
  <rect class="box" x="34" y="74" width="144" height="34" rx="3"/>
  <text class="t" x="46" y="95">YDLIDAR X4 Pro</text>
  <rect class="box" x="34" y="116" width="144" height="34" rx="3"/>
  <text class="t" x="46" y="137">BRIO 100 카메라</text>
  <rect class="box" x="34" y="158" width="144" height="34" rx="3"/>
  <text class="t" x="46" y="179">마이크</text>

  <!-- ===== ESP32 (모터 보드는 kinematics 와, 센서 보드는 EKF 와 같은 높이) ===== -->
  <rect class="zone" x="20" y="235" width="172" height="175" rx="4"/>
  <text class="zt" x="34" y="257">ESP32 ×2</text>
  <rect class="box" x="34" y="273" width="144" height="56" rx="3"/>
  <text class="t" x="46" y="293">모터 보드</text>
  <text class="ts" x="46" y="309">구동 PWM · 조향 서보</text>
  <text class="ts" x="46" y="323">watchdog 300ms</text>
  <rect class="box" x="34" y="340" width="144" height="56" rx="3"/>
  <text class="t" x="46" y="360">센서 보드</text>
  <text class="ts" x="46" y="376">엔코더 ×2 · IMU</text>
  <text class="ts" x="46" y="390">온습도 · 초음파 ×2</text>

  <!-- ===== Jetson ===== -->
  <rect class="zone" x="300" y="40" width="436" height="440" rx="4"/>
  <text class="zt" x="316" y="62">JETSON ORIN NANO — ROS 2 HUMBLE</text>

  <!-- 좌측 열: 주행 -->
  <rect class="box" x="316" y="76" width="188" height="40" rx="3"/>
  <text class="t" x="328" y="101">SLAM Toolbox</text>

  <rect class="box" x="316" y="136" width="188" height="50" rx="3"/>
  <text class="t" x="328" y="156">Nav2</text>
  <text class="ts" x="328" y="173">Smac Hybrid-A* + RPP</text>

  <rect class="boxk" x="316" y="206" width="188" height="50" rx="3"/>
  <text class="t" x="328" y="226">safety_gate</text>
  <text class="ts" x="328" y="243">collision_monitor</text>

  <rect class="boxk" x="316" y="276" width="188" height="50" rx="3"/>
  <text class="t" x="328" y="296">vehicle_kinematics</text>
  <text class="ts" x="328" y="313">δ 클램프 — 곡률 상한</text>

  <rect class="box" x="316" y="346" width="188" height="44" rx="3"/>
  <text class="t" x="328" y="366">EKF 오도메트리</text>
  <text class="ts" x="328" y="382">robot_localization</text>

  <!-- 우측 열: 인지·기록 -->
  <rect class="box" x="528" y="76" width="188" height="50" rx="3"/>
  <text class="t" x="540" y="96">YOLO26n + BoT-SORT</text>
  <text class="ts" x="540" y="113">조건부 Pose</text>

  <rect class="box" x="528" y="146" width="188" height="40" rx="3"/>
  <text class="t" x="540" y="171">Mission Manager</text>

  <rect class="box" x="528" y="206" width="188" height="50" rx="3"/>
  <text class="t" x="540" y="226">음성 클라이언트</text>
  <text class="ts" x="540" y="243">Silero VAD</text>

  <rect class="box" x="528" y="276" width="188" height="50" rx="3"/>
  <text class="t" x="540" y="296">이벤트 녹화 · 스트리밍</text>
  <text class="ts" x="540" y="313">링 버퍼 8초</text>

  <rect class="box" x="528" y="346" width="188" height="44" rx="3"/>
  <text class="t" x="540" y="366">cloud_bridge</text>
  <text class="ts" x="540" y="382">텔레메트리 · 임무 명령</text>

  <rect class="box" x="316" y="410" width="400" height="50" rx="3"/>
  <text class="t" x="328" y="430">foxglove_bridge</text>
  <text class="ts" x="328" y="447">/map · /pose · /scan · TF 등 7개 · 읽기 전용</text>

  <!-- ===== 원격 GPU / 외부 API (음성 클라이언트와 같은 높이) ===== -->
  <rect class="zone" x="820" y="120" width="220" height="140" rx="4"/>
  <text class="zt" x="834" y="142">원격 GPU · 외부 API</text>
  <rect class="box" x="834" y="154" width="192" height="46" rx="3"/>
  <text class="t" x="846" y="174">Qwen3-ASR 1.7B</text>
  <text class="ts" x="846" y="190">FastAPI on L40S</text>
  <rect class="box" x="834" y="208" width="192" height="36" rx="3"/>
  <text class="t" x="846" y="231">GMS gpt-5.4-mini</text>

  <!-- ===== 관제 (EC2) ===== -->
  <rect class="zone" x="820" y="300" width="220" height="182" rx="4"/>
  <text class="zt" x="834" y="322">관제 (EC2)</text>
  <rect class="box" x="834" y="348" width="192" height="40" rx="3"/>
  <text class="t" x="846" y="373">Mosquitto MQTT 5</text>
  <rect class="box" x="938" y="404" width="88" height="62" rx="3"/>
  <text class="t" x="948" y="425">Spring Boot</text>
  <text class="ts" x="948" y="442">REST · STOMP</text>
  <text class="ts" x="948" y="458">MQTT 구독</text>
  <rect class="box" x="834" y="404" width="84" height="28" rx="3"/>
  <text class="ts" x="842" y="423">S3 스토리지</text>
  <rect class="box" x="834" y="438" width="84" height="28" rx="3"/>
  <text class="ts" x="842" y="457">TimescaleDB</text>

  <!-- ===== 관제 웹 ===== -->
  <rect class="box" x="1100" y="385" width="130" height="100" rx="3"/>
  <text class="t" x="1114" y="410">Next.js 관제 웹</text>
  <text class="ts" x="1114" y="430">실시간 영상 · 지도</text>
  <text class="ts" x="1114" y="449">임무 명령 · 이력</text>
  <text class="ts" x="1114" y="468">모바일 수동 조종</text>

  <!-- ===== 간선 ===== -->
  <!-- 센서 다발 -> Jetson -->
  <path class="edge" d="M192 133 H300" marker-end="url(#a)"/>
  <text class="el" x="200" y="127">LiDAR·영상·음성</text>

  <!-- 안전 체인 (주황): kinematics <-> 모터 보드, 같은 높이 직선 -->
  <path class="edgek" d="M316 301 H178" marker-start="url(#aks)" marker-end="url(#ak)"/>
  <text class="elk" x="216" y="294">USB Serial</text>

  <!-- 센서 보드 -> EKF, 같은 높이 직선 -->
  <path class="edge" d="M178 368 H316" marker-end="url(#a)"/>
  <text class="el" x="216" y="386">USB Serial</text>

  <!-- 좌측 열 수직 흐름 -->
  <path class="edge" d="M410 116 V136" marker-end="url(#a)"/>
  <path class="edgek" d="M410 186 V206" marker-end="url(#ak)"/>
  <path class="edgek" d="M410 256 V276" marker-end="url(#ak)"/>

  <!-- 우측 열 수직 흐름 -->
  <path class="edge" d="M622 126 V146" marker-end="url(#a)"/>
  <path class="edge" d="M622 186 V206" marker-end="url(#a)"/>

  <!-- Mission Manager -> 이벤트 녹화 (열 사이 통로) -->
  <path class="edge" d="M528 166 H516 V301 H528" marker-end="url(#a)"/>

  <!-- 음성 <-> 원격 GPU 영역, 같은 높이 직선 -->
  <path class="edge" d="M716 231 H820" marker-start="url(#as)" marker-end="url(#a)"/>
  <text class="el" x="748" y="224">HTTPS</text>

  <!-- 녹화 -> 관제 웹 (WebRTC, 상단 통로) -->
  <path class="edge" d="M716 284 H1165 V385" marker-end="url(#a)"/>
  <text class="el" x="988" y="277">WebRTC WHEP</text>

  <!-- 녹화 -> S3 (presigned) -->
  <path class="edge" d="M716 318 H752 V418 H834" marker-end="url(#a)"/>
  <text class="el" x="742" y="434">presigned PUT</text>

  <!-- cloud_bridge <-> MQTT : 같은 높이, 직선 -->
  <path class="edge" d="M716 368 H834" marker-start="url(#as)" marker-end="url(#a)"/>
  <text class="el" x="758" y="361">MQTT 2Hz</text>

  <!-- MQTT <-> Spring -->
  <path class="edge" d="M982 388 V404" marker-start="url(#as)" marker-end="url(#a)"/>

  <!-- Spring -> S3 · TimescaleDB -->
  <path class="edge" d="M938 418 H918" marker-end="url(#a)"/>
  <path class="edge" d="M938 452 H918" marker-end="url(#a)"/>

  <!-- Spring <-> 관제 웹 : 같은 높이, 직선 -->
  <path class="edge" d="M1026 435 H1100" marker-start="url(#as)" marker-end="url(#a)"/>
  <text class="el" x="1044" y="428">REST · WS</text>

  <!-- foxglove -> 관제 웹 (하단 통로) -->
  <path class="edge" d="M660 460 V500 H1165 V485" marker-end="url(#a)"/>
  <text class="el" x="1040" y="518">wss:8765</text>

  <!-- ===== 캡션 ===== -->
  <text class="cap" x="20" y="538">진입점은 demo_up.sh → demo.launch.py 하나다. ESP32 · Nav2 · 탐사 · 접근 · 안전 · EKF 는 기본 false 이며 인자로 켠다.</text>
  <text class="cap" x="20" y="556">주황색이 실제 모터 명령이 지나는 안전 체인이다. foxglove_bridge 는 읽기 전용으로 관제 웹의 실시간 지도를 공급한다.</text>
</svg>
