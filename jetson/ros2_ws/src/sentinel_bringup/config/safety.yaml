# 안전 체인 가운데 두 층 (S15P11A301-237, 명세 24.1·34-7)
#
# 이 두 노드는 **직접 만들지 않는다.** nav2 것이 이미 설치돼 있고
# (nav2_velocity_smoother·nav2_collision_monitor 1.1.20), 우리가 만들면 같은 일을
# 하는 코드가 둘 생긴다. 우리 몫은 양 끝단(command_mux·safety_gate)이다.
#
# ## 체인 순서와 그 근거
#
#   /cmd_vel_nav ─┐
#                 ├→ command_mux → /cmd_vel_muxed
#   /cmd_vel_manual┘
#     → velocity_smoother → /cmd_vel_smoothed
#     → collision_monitor → /cmd_vel_safe
#     → safety_gate       → /cmd_vel → vehicle_kinematics
#
# **smoother 가 collision_monitor 보다 앞이다.** 명세 04장 요약(8.1)은 반대로
# 적혀 있었는데 그것이 틀렸다 — smoother 를 뒤에 두면 collision_monitor 의 급정지가
# 감가속 제한에 걸려 **천천히 멈춘다.** 비상 정지가 완만해지는 것은 안전 기능의
# 실패다. 03장 34-7 의 순서가 이 순서이며 그쪽이 규범이다.
#
# ## 값은 잠정이다
#
# 제동거리·트랙폭·바퀴 지름이 아직 실측되지 않았다(TBD-CAL-001·TBD-CAL-002).
# 그래서 정지 구역을 보수적으로 크게 잡았다. 실측이 오면 여기만 고친다.

velocity_smoother:
  ros__parameters:
    # safety_gate·command_mux 와 같은 20Hz 다. 체인 전체가 한 주기로 돌면
    # 층마다 지연이 쌓이는 것을 계산하기 쉽다(20Hz × 4층 = 최악 200ms).
    smoothing_frequency: 20.0

    # OPEN_LOOP 다. CLOSED_LOOP 는 odom 을 읽어 실제 속도에서 출발하는데, 우리
    # 오도메트리는 전방 캐스터 슬립으로 오차가 있고(03장) IMU 장착이 아직
    # 미확정이다(TBD-HW-012). 틀린 피드백으로 보정하면 지령이 흔들린다.
    feedback: "OPEN_LOOP"
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

    # [x, y, theta]. y 는 차동 구동이라 항상 0 이다.
    # x 상한은 nav2.yaml 의 desired_linear_vel **이상**이어야 한다 — 여기가 더
    # 낮으면 컨트롤러가 낸 속도를 이 층이 깎아 추종이 어긋난다. 기본 속도가
    # 0.30 으로 확정되면서 함께 0.30 으로 올렸다(2026-08-09, S15P11A301-342 —
    # 0.30 명령 = 실속도 99% 실측).
    max_velocity: [0.30, 0.0, 1.0]
    min_velocity: [-0.30, 0.0, -1.0]

    # 가감속 상한. 급가속이 전방 캐스터를 튀게 만들고 그 슬립이 오도메트리 yaw 를
    # 갉아먹는다(03장). 0.5 m/s² 면 0 → 0.30m/s 가 0.6초다.
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]

    # 지령 성분을 비율로 함께 줄이지 않는다. 곡률이 바뀌면 컨트롤러가 자기가
    # 보낸 호대로 간다고 가정한 것이 깨져 보정하려다 진동한다
    # (kinematics.saturate 가 양쪽을 같은 비율로 줄이는 것과 같은 이유다).
    scale_velocities: false

    # 아주 작은 지령은 0 으로 만든다. 모터가 돌지 못하는 크기의 명령은
    # 소음과 열만 만든다. 실측 전 잠정값이다(TBD-CAL-001).
    deadband_velocity: [0.02, 0.0, 0.05]

    # 입력이 이 시간 이상 없으면 0 을 낸다. 명령 TTL(300ms)보다 길게 두어
    # 판정 주체를 safety_gate 하나로 유지한다 — 여기서 먼저 끊으면 게이트가
    # COMMAND_STALE 이유를 낼 기회가 없어져 로그에 원인이 안 남는다.
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"

    transform_tolerance: 0.2
    # 소스가 이 시간 이상 낡으면 collision_monitor 는 그 소스를 **건너뛴다.**
    # 즉 라이다가 죽으면 "장애물 없음" 과 똑같이 통과시킨다. 그래서 /scan
    # 신선도는 safety_gate 가 따로 본다(gate.py 의 SCAN_STALE). 여기 값을
    # 줄여도 그 구멍은 막히지 않는다 — 막는 곳이 다르다.
    source_timeout: 0.5

    # **끈다.** 켜면 스캔 시각 기준으로 `odom → base_footprint` 를 조회해 그 사이
    # 로봇이 움직인 만큼 구역을 보정하는데, 그 조회가 실측에서 계속 실패했다:
    #
    #   Failed to get "lidar_link"->"base_footprint" ... Lookup would require
    #   extrapolation into the future ... when looking up transform from
    #   frame [odom] to frame [base_footprint]
    #
    # 휠 오도메트리 TF 가 스캔보다 수십 ms 늦게 올라오기 때문이고, 그 상태에서
    # collision_monitor 는 **아무것도 발행하지 않았다**(2026-08-04 실측:
    # /cmd_vel_smoothed 18.33Hz 가 들어오는데 /cmd_vel_safe 0.00Hz). 체인이
    # 가운데서 끊긴 것이며 증상은 "로봇이 안 움직인다" 뿐이다.
    #
    # 끄는 대가는 계산해서 받아들였다. 보정 대상은 소스 시각과 현재의 로봇 이동량인데,
    # 체인 주기 50ms + TF 지연 20ms ≈ 70ms 이고 최고 속도 0.30m/s 에서 **2.1cm** 다.
    # 정지 구역이 범퍼 앞 0.25m 라(S15P11A301-356) 그 안에 든다.
    # 속도 상한을 올리면 이 계산을 다시 해야 한다.
    base_shift_correction: False
    # 입력이 끊긴 뒤에도 이 시간 동안 0 을 계속 낸다. 하류가 침묵과 정지를
    # 구별할 수 있게 하는 것이 이 체인 전체의 방침이다.
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    # 좌표는 base_footprint 기준 [x1,y1, x2,y2, ...] 평면 배열이다.
    # **전부 소수점을 붙인다** — ROS 2 YAML 파서는 int 와 float 이 섞인 배열을
    # 거부한다("Sequence should be of same type", S15P11A301-236 에서 겪었다).
    #
    # 기준은 실측 차체다(nav2.yaml footprint: x -0.11~+0.80, y ±0.31,
    # base_footprint = 후륜축). 옛 값(전방 0.40·±0.28)은 낡은 원형 가정
    # (반경 0.20) 위에 있어 **정지 구역 전체가 차체 안**이었다 — 라이다 점이
    # 거기 들어오려면 장애물이 이미 차체를 관통해 있어야 했다(S15P11A301-356).
    #
    # 정지 구역은 범퍼 앞 0.25m 다. 0.30m/s 기준 최악 정지거리는
    # 감속(0.5m/s²) 9cm + 체인 지연 200ms 6cm + 스캔 주기 100ms 3cm = 18cm 로
    # 7cm 남는다. 시연 환경이 좁아 의도적으로 조인 값이다(라이다 신뢰 전제) —
    # 속도 상한(0.30)을 올리면 이 계산을 다시 해야 한다.
    PolygonStop:
      type: "polygon"
      points: [1.05, 0.33, 1.05, -0.33, -0.15, -0.33, -0.15, 0.33]
      action_type: "stop"
      # 이 개수를 **넘는** 점이 구역 안에 있으면 발동한다. 3 은 잡음 한두 점에
      # 반응하지 않으면서 실제 장애물은 놓치지 않는 값이다(nav2 예제 기본값).
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    # 감속 구역은 정지 구역 앞이다(범퍼 앞 0.50m). 여기서 미리 줄여 두면 정지
    # 구역에 들어갈 때의 속도가 낮아 실제 정지거리가 짧아진다. 반폭 0.40 은
    # 교실 문(약 0.9m) 통과 시 감속 없이 지나가는 값이다.
    PolygonSlow:
      type: "polygon"
      points: [1.30, 0.40, 1.30, -0.40, -0.15, -0.40, -0.15, 0.40]
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    # approach 형(FootprintApproach)은 쓰지 않는다. local costmap 의
    # published_footprint 를 구독해 충돌까지의 시간을 예측하는데, 그 예측이
    # 오도메트리 품질에 의존한다. 캐스터 슬립이 있는 상태에서 예측 기반
    # 판정을 넣으면 틀린 시점에 멈추거나 안 멈춘다. 거리 기반 두 구역만 쓴다.

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

# ── 5층: 차량 운동학 (S15P11A301-172 실측 반영) ───────────────────────────────
#
# 2026-08-06 실측. 종전 코드 기본값은 wheelbase 0.50·δ_max 30° 였고, 그것으로
# 계산한 R_min 은 0.87m 였다 — **실제 1.69m 의 절반**이다.
#
#   R_min = L / tan(δ_max) = 0.683 / tan(22°) = 1.69 m
#
# 이 값이 틀리면 자전거 모델이 δ = atan(L·ω/v) 를 작게 계산해 **로봇이 지령보다
# 덜 꺾는다.** 경로를 벗어나는데 로그에는 아무 오류가 없다.
#
# δ_max 를 22 로 낮추는 것은 링키지 보호도 겸한다. 펌웨어 STEERING_MAX_MDEG 가
# 아직 30000(30°)이라, ROS 쪽에서 먼저 잘라 주지 않으면 링키지가 기계적 한계에
# 닿은 뒤에도 서보가 밀어 전류가 치솟는다. 펌웨어 상수도 22000 으로 맞추는 것이
# 옳고(이중 방어), 그것은 hardware 레인이다.
#
# **여기 값이 맞아도 지금은 바퀴가 그만큼 안 꺾인다** (2026-08-08, S15P11A301-341).
# 서보 실측이 들어왔다: 중립 145°, 최대 오프셋 ±55°(90~200), 그때 앞바퀴 22°.
# 즉 **링키지 비가 55/22 = 2.5** (서보 2.5도당 바퀴 1도)다.
#
# 펌웨어는 그 비를 두 끝값의 몫으로 계산한다.
#
#   servoDegPerSteeringDeg() = servoMaxOffsetDeg / (STEERING_MAX_MDEG / 1000)
#   지금:  30 / 30 = 1.0     <- 서보 1도 = 바퀴 1도 (틀림)
#   맞게:  55 / 22 = 2.5
#
# 그래서 여기서 22° 를 지령해도 **실제로는 8.8° 만 꺾이고 R_min 이 4.41m 가 된다.**
# 위에 적은 1.69m 는 이 두 상수가 고쳐진 뒤에야 참이 된다. 2026-08-08 실기동에서
# steering_clamp_count 가 7224 까지 올라간 것이 이 결함의 관측이다 — 컨트롤러가
# 1.69m 곡률을 요구하는데 차가 4.4m 밖에 못 내니 조향이 상한에 붙어 있었다.
#
# **이 값(22.0)은 그대로 두는 것이 맞다.** 링키지 비를 여기서 보정하지 않는다 —
# 이 파라미터는 「앞바퀴가 실제로 꺾이는 각」의 상한이고, 서보 각으로의 변환은
# 펌웨어의 몫이다. 여기를 55 로 올리면 자전거 모델이 틀린 δ 로 계산한다.
vehicle_kinematics:
  ros__parameters:
    wheelbase_m: 0.683
    max_steering_deg: 22.0
    # esp32_motor_bridge의 최종 송신 한계(max_drive_mmps)와 같은 값이어야 한다.
    max_drive_mmps: 300
