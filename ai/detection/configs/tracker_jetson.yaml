# Sentinel UGV 트래커 설정 [Jetson 프로파일]
#
# **ReID는 꺼져 있다. 명세 준수 상태다.**
#
# 2026-08-05에 잠시 켰다가 같은 날 되돌렸다. 젯슨 담당자가 채택하지 않기로 해서다.
# 개발 PC 프로파일(configs/tracker_sentinel.yaml)에서는 계속 켜둔다 — 실험·측정용이다.
#
# ## 왜 껐나
#
# 켜려면 로봇 쪽에 두 가지가 더 필요한데, 그 부담이 얻는 것보다 크다고 봤다.
#
#   1) models/yolo26n-reid.onnx 를 따로 배치해야 한다. models/ 는 Git에 없고,
#      ultralytics 8.4.104에서는 `yolo export`로 뽑히지도 않는다(ReidModel 클래스 부재).
#      즉 파일을 사람이 직접 옮겨야 하고, 없으면 기동이 실패한다.
#   2) aarch64용 onnxruntime-gpu 가 필요하다. PyPI 휠이 없어 JetPack 매칭 휠을
#      NVIDIA Jetson 인덱스에서 받아야 한다. CPU 빌드로 깔리면 조용히 느려진다.
#
# 여기에 FPS 대가가 겹친다. ReID는 매 프레임 사람 수만큼 추가 추론이 들어가
# 개발 PC 실측으로 약 30% 하락했다. Jetson 실측 9.45FPS 기준이면 약 6.6FPS이며,
# 명세 25.6의 Detect 15FPS 목표에서 더 멀어진다. **Jetson 실측은 끝내 없었다.**
#
# ## 무엇을 포기하는가
#
# 시야를 벗어났다 돌아온 사람의 trackId 유지를 포기한다. 개발 PC 실측 기준으로
# 추적 ID 파편화가 그만큼 늘어난다.
#
#     ReID 켬   발급 trackId 19개
#     ReID 끔   발급 trackId 33개   (AI-Hub 3,660프레임, 동시 최대 7명)
#
# **이것이 팀 계약을 깨지는 않는다.** 명세의 중복 판정은 trackId가 아니라 위치·시간
# 기반이다 — "기존 위치 1m 이내 AND 최근 15초 이내"(docs/07-AI-탐지.md 25.1).
# 페이로드의 trackIds 도 nullable 배열이며 중복 제거는 Mission Manager가 한다.
# SLAM 연동 후 mapPose가 붙으면 명세가 의도한 방식으로 해결된다.
#
# ## 다시 켜려면
#
# 위 전제 조건 2개를 먼저 갖춘 뒤:
#
#     proximity_thresh: 0.0     # 0.5는 "IoU 0.5 이상일 때만 외모를 본다"라
#                               # 시야 이탈 후 재등장에 무용지물이다
#     with_reid: True
#     model: models/yolo26n-reid.onnx
#
# model 을 "auto"로 두면 안 된다. YOLO26 Detect 헤드가 end2end라서 yolo26n-cls.pt
# (ImageNet 분류 모델)로 조용히 대체되는데, 분류 특징은 "사람인가"만 인코딩하고
# "누구인가"를 구분하지 못한다(실측: 타인 간 유사도 0.835). ID가 뒤바뀐다.
# 전용 ReID 모델은 타인 간 0.278, AUC 0.915다.
#
# 켠 뒤에는 반드시 avg_fps 를 재고 9.45FPS 기준과 비교한다.

tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.35
# memory.forget_seconds에서 실측 FPS로 자동 환산되므로 이 값은 초기값일 뿐이다.
track_buffer: 300
match_thresh: 0.8
fuse_score: True

# 이동하는 카메라 보정. UGV는 주행하며 촬영하므로 필수다.
# (명세는 ByteTrack을 지정하지만 ByteTrack에는 GMC가 없다 — AGENTS.md §0 이탈 1)
gmc_method: sparseOptFlow

# ReID 비활성 (명세 준수). 켜는 법은 위 주석 참고.
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
