# Sentinel UGV 전용 트래커 설정 (BoT-SORT 기반)
#
# Ultralytics 기본 botsort.yaml에서 다음을 조정했다.
#
# 1) gmc_method: sparseOptFlow
#    UGV는 주행하면서 촬영하므로 카메라 자체가 움직인다. 전역 움직임 보정이 없으면
#    로봇이 회전할 때 정지한 사람도 크게 이동한 것으로 보여 트랙이 끊긴다.
#    ByteTrack에는 이 기능이 없어 BoT-SORT를 선택했다.
#
# 2) track_buffer 30 → 300  (실험값, 2026-07-29)
#    놓친 트랙을 살려두는 프레임 수. **초가 아니라 프레임 단위다.**
#    실제 유지 시간 = track_buffer / 파이프라인 실측 FPS.
#      30 FPS → 10초 / 15 FPS → 20초 / 10 FPS → 30초
#    실행 종료 시 출력되는 avg_fps로 환산해 목표 시간에 맞게 조정한다.
#
#    잃어버린 트랙도 매 프레임 GMC로 보정되며 매칭 후보에 남는다
#    (byte_tracker.py: strack_pool = joint_stracks(tracked, lost) → multi_gmc → first_association).
#    따라서 카메라가 시야를 돌렸다 돌아오면 IoU만으로 같은 trackId를 되찾을 수 있다.
#    쓰러진 사람을 놓치는 것(false negative)이 최우선 리스크이므로(AGENTS.md §23)
#    ID switch가 다소 늘더라도 트랙 유지를 우선한다.
#
#    ⚠️ 부작용: 오래된 트랙이 나중에 등장한 **다른 사람을 가로챌** 수 있다.
#    두 명 이상으로 ID 뒤바뀜을 반드시 함께 확인한다.
#
#    ⚠️ 한계: GMC는 이미지 평면 affine이라 카메라 동작에 따라 정확도가 갈린다.
#    제자리 회전·팬은 잘 맞고, 전후 주행(시차)이나 장소 이동은 취약하다.
#    버퍼를 늘려도 GMC 예측이 틀어지면 매칭은 실패한다.
#
# 3) new_track_thresh 0.25 → 0.35
#    track_buffer를 늘리면 새 트랙이 남발될 수 있어 생성 기준을 함께 높였다.
#
# 4) with_reid: True + proximity_thresh: 0.0  (실험, 2026-07-29)
#
#    IoU 기반 재매칭이 원리적으로 불가능함을 실측으로 확인했다.
#    사람이 안 보이는 동안에는 관측이 없어 예측 오차를 바로잡을 수 없고, 오차가 누적된다.
#    카메라 팬 2200px 실험에서 GMC 보정 후에도 lost 박스와 실제 위치의 오차가
#    564px까지 벌어졌다(사람 폭 240px). IoU=0이 되어 재매칭이 불가능하다.
#    track_buffer를 늘려도 트랙만 오래 살 뿐 위치는 더 틀려진다.
#
#    따라서 위치가 아닌 **외모**로 매칭해야 한다.
#    proximity_thresh: 0.5 → 0.0 이 핵심이다. 0.5는 "IoU 0.5 이상일 때만 외모를 본다"는
#    뜻이라 시야를 벗어난 재등장에는 무용지물이다. 0으로 두면 위치 제약 없이 외모로 매칭한다.
#
#    model: auto — 별도 pip 패키지 설치가 필요 없는 경로다.
#    탐지 모델의 backbone 특징을 재사용하거나, 호환되지 않으면 yolo26n-cls.pt로 대체된다.
#    (yolo26n-reid.onnx는 성능이 더 좋을 수 있으나 onnxruntime 설치가 필요하다.)
#
#    ⚠️ 알려진 한계
#    - 프레임마다 사람 crop에 추가 추론이 들어가 FPS가 떨어진다.
#    - 위치 제약을 풀었으므로 화면 안의 닮은 사람끼리 ID가 뒤바뀔 수 있다.
#    - **ReID 모델은 서 있는 보행자로 학습되어 누운 사람에서 가장 부정확하다.**
#      우리 탐지 대상이 쓰러진 사람이므로 이 한계를 반드시 실측으로 확인해야 한다.
#
#    프로젝트 명세는 "정밀 재식별"을 범위 밖으로 둔다
#    (docs/01-프로젝트-개요.md 95행, docs/04-자율주행-AI.md 404행).
#    실제 로봇에서는 지도 좌표(mapPose)가 더 안정적인 신원이므로,
#    이 설정이 기대에 못 미치면 SLAM 통합 쪽으로 방향을 잡는다.

tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.35
track_buffer: 300
match_thresh: 0.8
fuse_score: True

# 이동하는 카메라 보정
gmc_method: sparseOptFlow

# ReID 활성. proximity_thresh 0.0이 위치 제약 해제의 핵심이다.
#
# model은 반드시 명시한다. "auto"로 두면 YOLO26 Detect 헤드가 end2end라서
# yolo26n-cls.pt(ImageNet 분류 모델)로 조용히 대체된다. 분류 특징은 "사람인가"를
# 인코딩할 뿐 "누구인가"를 구분하지 못해(타인 간 유사도 0.835) ID가 뒤바뀐다.
# 이 프로젝트는 detection/pose 외 분류 모델을 쓰지 않는다.
proximity_thresh: 0.0
appearance_thresh: 0.8
with_reid: True
model: models/yolo26n-reid.onnx
