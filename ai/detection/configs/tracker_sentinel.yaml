# Sentinel UGV 전용 트래커 설정 (BoT-SORT 기반)
#
# Ultralytics 기본 botsort.yaml에서 다음을 조정했다.
#
# 1) gmc_method: sparseOptFlow
#    UGV는 주행하면서 촬영하므로 카메라 자체가 움직인다. 전역 움직임 보정이 없으면
#    로봇이 회전할 때 정지한 사람도 크게 이동한 것으로 보여 트랙이 끊긴다.
#    ByteTrack에는 이 기능이 없어 BoT-SORT를 선택했다.
#
# 2) track_buffer 30 → 300  (실험값, 2026-07-29)
#    놓친 트랙을 살려두는 프레임 수. **초가 아니라 프레임 단위다.**
#    실제 유지 시간 = track_buffer / 파이프라인 실측 FPS.
#      30 FPS → 10초 / 15 FPS → 20초 / 10 FPS → 30초
#    실행 종료 시 출력되는 avg_fps로 환산해 목표 시간에 맞게 조정한다.
#
#    잃어버린 트랙도 매 프레임 GMC로 보정되며 매칭 후보에 남는다
#    (byte_tracker.py: strack_pool = joint_stracks(tracked, lost) → multi_gmc → first_association).
#    따라서 카메라가 시야를 돌렸다 돌아오면 IoU만으로 같은 trackId를 되찾을 수 있다.
#    쓰러진 사람을 놓치는 것(false negative)이 최우선 리스크이므로(AGENTS.md §23)
#    ID switch가 다소 늘더라도 트랙 유지를 우선한다.
#
#    ⚠️ 부작용: 오래된 트랙이 나중에 등장한 **다른 사람을 가로챌** 수 있다.
#    두 명 이상으로 ID 뒤바뀜을 반드시 함께 확인한다.
#
#    ⚠️ 한계: GMC는 이미지 평면 affine이라 카메라 동작에 따라 정확도가 갈린다.
#    제자리 회전·팬은 잘 맞고, 전후 주행(시차)이나 장소 이동은 취약하다.
#    버퍼를 늘려도 GMC 예측이 틀어지면 매칭은 실패한다.
#
# 3) new_track_thresh 0.25 → 0.35
#    track_buffer를 늘리면 새 트랙이 남발될 수 있어 생성 기준을 함께 높였다.
#
# 4) ReID는 쓰지 않는다 (2026-08-06 최종)
#
#    2026-07-29에 실험으로 켰다가 껐다. 젯슨에서 채택하지 않기로 하면서
#    최종 시연 범위에서 빠졌고, **개발 PC 프로파일도 로봇과 같게 맞췄다.**
#    노트북에서 확인한 동작이 로봇에서 달라지면 확인의 의미가 없기 때문이다.
#
#    측정해둔 값은 남긴다. 다시 필요해지면 근거를 새로 만들지 않아도 된다.
#
#      발급 trackId       33개 → 19개 (-42%)   AI-Hub 3,660프레임, 동시 최대 7명
#      임베딩 판별력      AUC 0.915            같은 사람 0.572 / 타인 0.278
#      FPS               개발 PC 약 -30%
#
#    IoU만으로는 시야 이탈 후 재매칭이 원리적으로 불가능하다는 것도 실측했다.
#    카메라 팬 2200px 실험에서 GMC 보정 후에도 오차가 564px까지 벌어졌다
#    (사람 폭 240px). track_buffer를 늘려도 트랙만 오래 살 뿐 위치는 더 틀려진다.
#
#    ⚠️ 다시 켤 때 주의
#    - proximity_thresh를 0.0으로 내려야 한다. 0.5는 "IoU 0.5 이상일 때만 외모를
#      본다"는 뜻이라 시야 이탈 후 재등장에는 무용지물이다.
#    - model을 "auto"로 두면 안 된다. YOLO26 Detect 헤드가 end2end라서
#      yolo26n-cls.pt(ImageNet 분류)로 조용히 대체되는데, 분류 특징은 "사람인가"만
#      인코딩하고 "누구인가"를 구분하지 못한다(타인 간 0.835 → ID 뒤바뀜).
#      전용 ReID 모델은 타인 간 0.278이다. onnxruntime 설치가 필요하다.
#    - ReID 모델은 서 있는 보행자로 학습되어 **누운 사람에서 가장 부정확하다.**
#      우리 탐지 대상이 쓰러진 사람이므로 이 한계를 먼저 실측해야 한다.
#
#    명세도 "정밀 재식별"을 범위 밖으로 둔다(docs/01-프로젝트-개요.md 85·95행,
#    docs/07-AI-탐지.md). 시야 이탈 후 신원 유지가 필요해지면 ReID가 아니라
#    지도 좌표(mapPose) 쪽이 명세가 의도한 방향이다.

tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.35
track_buffer: 300
match_thresh: 0.8
fuse_score: True

# 이동하는 카메라 보정
gmc_method: sparseOptFlow

# ReID 비활성 (명세 준수, 로봇 프로파일과 동일). 켜는 법은 위 주석 4번 참고.
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
