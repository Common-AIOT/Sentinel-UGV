# Sentinel UGV - 객체탐지 파이프라인 설정 [개발 PC 프로파일]
#
# 이 파일은 **개발 PC(Windows, 노트북 웹캠) 기준**이다. 파이프라인 동작 확인용이며,
# 실제 로봇에 올릴 때는 configs/pipeline.jetson.yaml 을 쓴다.
#   python -m src.main --config configs/pipeline.jetson.yaml --source 0 --show
#
# 모든 threshold는 이 파일에서 관리한다. 코드에 하드코딩하지 않는다(AGENTS.md §15).
# 초기값이며 ISSUE-06에서 조정한다.

detector:
  # 사전학습 COCO 모델. 파인튜닝 후에는 --model 인자로 교체한다(AGENTS.md §26).
  model: models/yolo26n.pt
  # 탐지 대상 클래스 이름. class id가 아니라 이름으로 판정한다(AGENTS.md §11).
  target_classes:
    - person
  confidence: 0.50
  iou: 0.70
  # 추적기 설정 (AGENTS.md §6 결정, 명세 25장).
  # BoT-SORT 기반 전용 설정. 이동 카메라 보정(GMC)과 긴 track_buffer를 쓴다.
  # 기본 ByteTrack으로 되돌리려면 bytetrack.yaml 로 바꾼다.
  tracker: configs/tracker_sentinel.yaml

# 카메라(live) 입력 설정. 파일 입력에는 적용되지 않는다.
#
# OpenCV는 해상도를 지정하지 않으면 대개 640x480으로 카메라를 연다.
# 카메라 성능과 무관하므로 실제 지원 해상도를 명시한다.
camera:
  width: 1280
  height: 720
  # USB 카메라는 고해상도에서 YUY2(무압축)를 쓰면 FPS가 급락한다. MJPG를 쓴다.
  fourcc: MJPG
  # 백엔드: auto | dshow | msmf | v4l2 | gstreamer | any
  # auto는 Windows→dshow, Linux/Jetson→v4l2로 자동 선택한다.
  # 이 개발 PC에서는 msmf가 프레임 grab에 실패한다(2026-07-29 실측).
  backend: auto
  # 요청한 FPS. 0이면 카메라 기본값을 쓴다.
  fps: 30

# Pose 실행 조건.
# 명세 25.6(docs/04-자율주행-AI.md:78)을 따른다.
#   "사람 3프레임 이상 연속 감지 시 활성, 약 2FPS, 3초 미감지 시 중단"
# 매 프레임 사람 수만큼 Pose를 돌리면 Detect FPS를 유지할 수 없다.
# Detect가 사람 발견을 책임지고 Pose는 자세 정보만 보조한다(명세 420행).
pose_trigger:
  min_bbox_width: 80
  min_bbox_height: 80
  # 이 프레임 수만큼 연속 감지되어야 Pose를 활성화한다.
  activate_after_frames: 3
  # Pose 최대 실행 빈도(Hz). 사이 프레임은 직전 판정을 재사용한다.
  max_fps: 2.0
  # 이 시간(초) 이상 미감지되면 연속성과 캐시를 초기화한다.
  deactivate_after_seconds: 3.0
  # true면 max_fps가 파이프라인 전체 예산이 된다(명세 431행 "약 2FPS").
  # false면 트랙당 예산이라 사람 N명일 때 초당 2N회가 된다. 자세한 설명은
  # configs/pipeline.jetson.yaml 참고.
  global_budget: true

pose:
  model: models/yolo26n-pose.pt
  confidence: 0.50
  # 개별 keypoint를 신뢰할 최소 confidence
  keypoint_confidence: 0.50
  # crop 시 bbox 주변 여유 비율 (관절이 경계에 걸리는 것을 완화)
  crop_margin: 0.10

posture:
  # 최소 두 개 이상의 신호를 조합해 판정한다(AGENTS.md §15).
  # torso_angle_deg: 상체(어깨중점→엉덩이중점) 벡터와 수직축이 이루는 각도.
  #   0에 가까우면 서 있음, 90에 가까우면 누움.
  torso_horizontal_deg: 55.0
  # bbox 가로/세로 비. 1.0 이상이면 누웠을 가능성.
  bbox_aspect_ratio: 1.20
  # 어깨-엉덩이 y 차이를 사람 높이로 정규화한 값. 작을수록 수평.
  vertical_extent_ratio: 0.25
  # 상체 각도가 이 값보다 작으면(= 거의 수직이면) 위 vertical_extent 신호를 버린다.
  #
  # 두 신호는 같은 것을 다르게 재므로 어긋나면 한쪽이 틀린 것이다. 상체가 수직인데
  # 어깨-엉덩이 간격이 좁게 나오는 것은 물리적으로 불가능하며, 그때는 extent가 틀렸다.
  # 하체가 책상·의자에 가려지면 엉덩이 keypoint가 어깨 근처로 잘못 찍힌다.
  #
  # 실측(2026-08-04, 관측 27,556건): FALLEN 판정의 상체 각도 평균이 10.98°(거의 수직),
  # 엉덩이 검출률은 23~28%(NORMAL은 41~45%)였다. 이 게이트로 FALLEN 22.4% → 13.1%.
  # 71850의 실제 쓰러짐 트랙 점수는 변하지 않았다(중앙 0.049, 최대 0.713 동일).
  #
  # 0으로 두면 게이트가 꺼진다(이전 동작).
  upright_angle_deg: 30.0
  # 상체 신호를 쓰기 위한 최소 유효 keypoint 수.
  # 미달이면 형상·부동 신호만으로 판정한다(라벨은 여전히 NORMAL/FALLEN).
  min_valid_keypoints: 4
  # 카메라 광축(앞뒤) 기울기 반영. torso_angle_deg는 이미지 좌표 기준이라
  # 좌우 기울기만 잡는다. 복도 방향으로 누운 사람이 사각지대가 되므로,
  # 어깨 폭 대비 상체 단축률로 앞뒤 기울기를 추정해 큰 쪽을 쓴다.
  depth_tilt: true
  # 똑바로 선 사람의 (상체 길이 / 어깨 폭) 기대비.
  # ⚠️ 해부학 통념값이며 실측 근거가 없다. 실영상 확보 후 조정할 것.
  torso_shoulder_ratio: 1.3
  # --- 점수화 (2026-08-03, 이진 분류 전환) ---
  # 각 신호를 임계값 기준 시그모이드로 0~1에 매핑해 가중 평균한다.
  # 이산 투표에서는 54도와 10도가 똑같이 "표 없음"이었지만 점수는 이를 구분한다.
  #
  # ⚠️ 아래 가중치와 폭은 실측 근거가 없다. 라벨 데이터 확보 후 로지스틱 회귀로
  #    교체할 자리다(계획 2단계). "검증됨"으로 보고하지 않는다.
  #
  # 가중 평균 점수가 이 값 이상이면 FALLEN.
  fallen_threshold: 0.5
  # 자세·형상 신호의 가중치.
  weight_torso_angle: 1.0
  weight_vertical_extent: 1.0
  weight_bbox_aspect: 0.8
  # 부동은 가중치가 아니라 **배수**다. 부동 1.0일 때 점수가 (1 + 이 값)배가 된다.
  #
  # 독립 항으로 더하면 가중 평균의 일정 비율을 무조건 채워, 형상이 애매할 때
  # 부동이 대신 점수를 밀어 올린다. 실측(2026-08-03)에서 부동이 1.0일 때
  # FALLEN이 되는 가로비가 1.47 → 0.93으로 떨어졌다. 0.93은 거의 정사각형이라
  # 상반신만 잡힌 앉은 사람도 걸린다.
  #
  # 곱셈이면 자세·형상 점수가 낮을 때 부동이 아무리 커도 결과가 낮게 유지된다.
  # 문헌의 "최종 몸 방향 + 바닥에 머문 시간" 조합이 이 형태다.
  inactivity_boost: 0.4
  # 시그모이드 폭. 임계값에서 이만큼 떨어지면 약 0.73/0.27이 된다.
  # 작을수록 예전 이산 판정에 가까워진다.
  width_torso_angle: 12.0
  width_vertical_extent: 0.08
  width_bbox_aspect: 0.25
  # 자세 흔들림 완충(hysteresis). 최근 N프레임의 다수결로 라벨을 정한다.
  # 누우면 팔다리가 가려져 점수가 출렁이는데, 완충이 없으면 라벨이 뒤집혀
  # fallen 누적이 끊긴다. 1이면 완충 없음(원래 동작).
  smoothing_window: 5
# 움직임 추적 — 부동(inactivity) 신호.
# 문헌의 쓰러짐 탐지는 "하강 속도, 최종 몸 방향, 바닥에 머문 시간"을 함께 가중한다.
# 관절이 하나도 안 잡혀도 동작하므로, 누운 사람의 관절이 가려지는 상황을 보완한다.
motion:
  # bbox 크기 대비 이 비율 미만으로 움직이면 "정지"로 본다.
  # 크기로 정규화해 카메라 이동과 거리 편차의 영향을 줄인다.
  still_ratio: 0.06
  # 이 시간(초) 이상 정지해 있으면 부동 점수가 1.0이 된다.
  full_still_seconds: 3.0

# 사람을 "기억"하는 시간. 이 값 하나가 아래 셋을 모두 결정한다.
#   1) 트래커가 같은 trackId를 유지하는 시간 (tracker의 track_buffer)
#   2) ID가 바뀌었을 때 누적 시간을 승계하는 시간
#   3) 트랙 상태를 폐기하는 시간
#
# 이전에는 이 셋이 따로 놀았고(트래커는 프레임 단위, 나머지는 초 단위)
# track_buffer가 프레임 단위라 실제 기억 시간이 FPS에 따라 25~91초로 출렁였다.
# 이제 초 단위 하나로 통일하고, track_buffer는 실측 FPS로 매 프레임 자동 환산한다.
memory:
  forget_seconds: 10.0
  # 자동 환산된 track_buffer의 하한/상한(프레임). 극단적인 FPS에서의 안전장치.
  # 하한이 너무 높으면 저FPS에서 기억 시간이 목표보다 길어진다(2 FPS·하한 30 → 15초).
  # 실행 통계의 memory_actual_sec가 target과 다르면 이 클램프에 걸린 것이다.
  min_track_buffer: 10
  max_track_buffer: 900

persistence:
  # 사람을 이 시간(초) 이상 안정적으로 관측하면 encounter를 확정한다.
  # **이것이 이벤트 트리거다.** 자세는 트리거가 아니다.
  # 명세 docs/01-프로젝트-개요.md:156, docs/04-자율주행-AI.md:80을 따른다.
  # 서 있거나 앉아 있는 요구조자도 구조 대상이므로 자세로 거르지 않는다.
  person_confirm_seconds: 1.0
  # FALLEN이 이 시간(초) 이상 지속되면 심각도 표시를 붙인다.
  # 명세 25.6: "동일 자세 약 1.5초 유지 시 이벤트"(docs/04-자율주행-AI.md:78, 444, 454)
  # 이벤트 발행 조건이 아니라 페이로드의 fallenSec 속성 판단용이다.
  fallen_seconds: 1.5
  # 같은 트랙에 대해 이벤트를 다시 발행하기까지의 최소 간격(초).
  # 명세 25.4의 중복 이벤트 제거(15초)를 로컬에서 1차 억제한다.
  event_cooldown_seconds: 15.0
  # 승계를 허용할 거리. 이전 bbox 크기의 배수로 지정한다.
  inherit_distance_ratio: 1.0

output:
  # 프레임 단위 로그. 용량이 크므로 기본 비활성.
  write_frame_log: false
  jsonl_frames: frames.jsonl
  jsonl_events: events.jsonl
  events_dir: events
  # 이벤트 이미지에 overlay를 그려 저장할지 여부
  draw_overlay_on_event_image: true
  # 이벤트가 확정된 프레임에서 해당 사람만 Pose를 강제로 한 번 실행한다.
  # 조건부 Pose는 약 2FPS라, 이벤트가 하필 Pose를 안 돌린 프레임에서 확정되면
  # 관제로 넘어가는 증빙 이미지에 골격이 없고 poseStatus도 직전 캐시값이 된다.
  # 쿨다운(event_cooldown_seconds) 때문에 실행 빈도가 매우 낮아 FPS 영향은 무시할 수준이다.
  # bbox가 pose_trigger.min_bbox_* 미만인 사람은 여기서도 건너뛴다(keypoint 신뢰 불가).
  pose_on_event: true

# 관제 보고용 메시지 봉투 (명세 31-5)
report:
  schema_version: "1.0"
  robot_id: SENTINEL-01
  # mission_id는 Mission Manager가 발급한다. 미연동 상태에서는 null.
  mission_id: null
