name: sentinel-ugv-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb:2.15.3-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sentinel-local]

  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.8.5}
    restart: unless-stopped
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_ICE_PORT:-8189}:8189/udp"
    networks: [sentinel-local]

volumes:
  postgres-local-data:

networks:
  sentinel-local:
    driver: bridge
