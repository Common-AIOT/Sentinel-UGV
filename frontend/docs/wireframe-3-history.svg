  <text class="ts" x="910" y="310">(9.1, 3.4) · 14:38</text>
  <circle cx="1070" cy="300" r="11" fill="#eef1f4" stroke="#c6ced5" stroke-width="1.3"/>
  <path d="M 1067 296 L 1075 300 L 1067 304 Z" fill="#8a95a0"/>

  <rect class="card" x="868" y="338" width="222" height="56" rx="3"/>
  <circle cx="890" cy="360" r="12" fill="#eef1f4" stroke="#c6ced5" stroke-width="1.3"/>
  <text class="t" x="910" y="358">대화 완료 · 1명</text>
  <text class="ts" x="910" y="376">위치 미기록 · 14:44</text>
  <circle cx="1070" cy="366" r="11" fill="#eef1f4" stroke="#c6ced5" stroke-width="1.3"/>
  <path d="M 1067 362 L 1075 366 L 1067 370 Z" fill="#8a95a0"/>

  <rect class="edge" x="0.75" y="0.75" width="1098.5" height="617.5"/>

  <!-- 핀 -->
  <g><circle class="pin" cx="200" cy="99" r="11"/><text class="pinT" x="200" y="103">1</text></g>
  <g><circle class="pin" cx="200" cy="63" r="11"/><text class="pinT" x="200" y="67">2</text></g>
  <g><circle class="pin" cx="510" cy="432" r="11"/><text class="pinT" x="510" y="436">3</text></g>
  <g><circle class="pin" cx="847" cy="110" r="11"/><text class="pinT" x="847" y="114">4</text></g>
  <g><circle class="pin" cx="847" cy="234" r="11"/><text class="pinT" x="847" y="238">5</text></g>
