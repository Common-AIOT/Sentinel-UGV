# person_detector 파라미터 (S15P11A301-136, 명세 25.2).
person_detector:
  ros__parameters:
    camera_topic: /camera/image_raw/compressed
    candidates_topic: /perception/person_candidates

    # 저장소 루트 기준 상대 경로. 실행 디렉터리가 ros2_ws이면 ../../ 를 붙인다.
    # launch 파일이 절대 경로로 바꿔 넘긴다.
    model_path: jetson/models/yolo26n.pt
    image_size: 640

    # 25.2의 "confidence가 설정값 이상이다". 최종값은 TBD-CAL-001이며 시연 환경
    # 검증셋으로 조정한다. 낮추면 오탐 클립이 생기고 높이면 어두운 곳을 놓친다.
    confidence: 0.5
    device: 0

    # 카메라 30fps를 전부 추론하지 않는다. 추론이 약 47ms이므로 5Hz면 GPU 여유가
    # 남고, 25.2의 "약 1초 동안 최소 관측 횟수"를 창 안에서 만족한다.
    # 32장이 관제 영상을 우선순위로 정했으므로 스트리밍을 밀어내면 안 된다.
    inference_period_seconds: 0.2

    # 추론과 별개로 둔다. 후보가 없을 때도 계속 발행해야 하고, 추론이 실패해도
    # "사람 없음"이 관제 경로에 흘러야 한다.
    publish_period_seconds: 0.2

    # 같은 사람으로 볼 최소 겹침. 30fps에서 걷는 사람은 프레임당 0.7 이상이다.
    iou_threshold: 0.3
    # 연속으로 못 봐도 track을 유지하는 횟수. 5Hz에서 3이면 0.6초다.
    max_misses: 3

    # 25.2의 "약 1초"와 "최소 관측 횟수".
    window_seconds: 1.0
    # 2 미만은 허용하지 않는다. 25.2가 단일 프레임 확정을 금지한다.
    min_observations: 3
