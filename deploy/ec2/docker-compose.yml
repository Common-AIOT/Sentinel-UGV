name: sentinel-ugv

services:
  postgres:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb:2.15.3-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sentinel]

  backend:
    image: ${BACKEND_IMAGE:-sentinel-backend:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel}
      DB_USER: ${DB_USER:-sentinel}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-sentinel-ugv-assets}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      CONTROL_LEASE_TTL_MS: ${CONTROL_LEASE_TTL_MS:-3000}
    expose: ["8080"]
    networks: [sentinel]

  frontend:
    image: ${FRONTEND_IMAGE:-sentinel-frontend:local}
    restart: unless-stopped
    depends_on: [backend]
    expose: ["3000"]
    networks: [sentinel]

  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.8.5}
    restart: unless-stopped
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_ICE_PORT:-8189}:8189/udp"
    networks: [sentinel]

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on: [backend, frontend, mediamtx]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [sentinel]

volumes:
  postgres-data:

networks:
  sentinel:
    driver: bridge
