version: '3.8'

services:
  postgres:
    # 시계열(hypertable)과 일반 테이블을 한 인스턴스에서 쓰기 위해 TimescaleDB 확장 이미지를 사용한다 (13.1).
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-prod
    # 기존 데이터 디렉터리를 그대로 재사용하는 경우에도 확장이 로드되도록 명시한다.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sentinel_ugv}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always

  backend:
    # 배포는 CI 가 .env 의 DOCKER_IMAGE 로 커밋 SHA 태그를 고정한다 (S15P11A301-130).
    # 기본값은 .env 에 값이 없을 때의 수동 fallback 이며, 로컬 태그가 아니라
    # Docker Hub 에서 pull 되도록 계정 접두어를 포함한다.
    image: ${DOCKER_IMAGE:-wonbne/spring-backend:latest}
    container_name: spring-backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentinel_ugv}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # 브로커는 같은 도커 네트워크에 있으므로 내부 평문 리스너로 붙는다(명세 31-11).
      - MQTT_URL=tcp://mosquitto:1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - mosquitto
    restart: always

  # 젯슨 telemetry 를 받는 MQTT 브로커 (명세 31-3).
  # 설정·ACL 은 CI 가 전송하고, 계정 비밀번호(passwd)는 EC2 에서 한 번 생성해 유지한다.
  # 절차: docs/private-docs/mqtt-setup.md
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-prod
    # 9001(websockets)만 호스트 루프백에 노출한다. nginx 가 443 의 /mqtt 로 프록시한다.
    # 1883 은 publish 하지 않으므로 도커 네트워크 안에서만 닿는다.
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto:/seed:ro
      - mosquitto_data_prod:/mosquitto/data
    # 브로커는 mosquitto(uid 1883) 로 동작하므로 호스트 파일 소유자가 다르면
    # passwd·acl 을 읽지 못하고 기동에 실패한다("Unable to open pwfile").
    # CI 가 재배포할 때마다 소유자·권한이 초기화되므로 컨테이너 안에서 복사·교정 후 기동한다.
    entrypoint:
      - sh
      - -c
      - >
        cp /seed/mosquitto.conf /seed/acl /seed/passwd /mosquitto/config/ &&
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl &&
        chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    restart: always

  minio:
    image: minio/minio
    container_name: minio-prod
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_URL=https://s3.sentinel-ugv.xyz
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /home/ubuntu/minio-data:/data
    restart: always

volumes:
  postgres_data_prod:
  mosquitto_data_prod:
