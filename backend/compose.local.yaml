services:
  postgres:
    # 시계열(hypertable)과 일반 테이블을 한 인스턴스에서 쓰기 위해 TimescaleDB 확장 이미지를 사용한다 (13.1).
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-db
    # 기존 데이터 디렉터리를 그대로 재사용하는 경우에도 확장이 로드되도록 명시한다.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      - POSTGRES_DB=sentinel_ugv
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME:-myuser}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 젯슨 telemetry 를 받는 MQTT 브로커 (명세 31-3).
  # 로컬은 익명 접속을 허용한다. 계정·ACL 은 운영 설정(mosquitto.prod.conf)에서 적용한다.
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-local
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:

