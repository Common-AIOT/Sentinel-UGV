# Sentinel UGV - 객체탐지 파이프라인 설정 [Jetson Orin Nano 8GB 프로파일]
#
# 사용:
#   python -m src.main --config configs/pipeline.jetson.yaml --source 0
#
# 개발 PC 프로파일(configs/pipeline.yaml)과 다른 점만 주석으로 설명한다.
# 판정 임계값은 두 프로파일이 같아야 한다. 다르면 PC에서 맞춘 값이 로봇에서 달라진다.
#
# ⚠️ 자원 전제
# Orin Nano 8GB는 SLAM·Nav2·WebRTC와 메모리·연산을 나눠 쓴다
# (docs/04-자율주행-AI.md, ai/README.md). 비전이 자원을 독점하면 주행이 멈춘다.
# 명세 목표는 Detect 상시 약 15FPS, Pose 조건부 약 2FPS다(25.6).

detector:
  # ⚠️ 기본값을 .engine으로 바꾸지 않는다.
  #
  # TensorRT 엔진은 기기·드라이버 종속이라 커밋되지 않는다(.gitignore). 여기에 .engine을
  # 박으면 엔진을 굽지 않은 기기에서 clone 직후 실행이 깨진다. 엔진은 --model 인자로 넘긴다.
  #
  #   # 빌드 (Jetson에서 직접, 약 425초). PYTHONPATH 없으면 tensorrt 임포트 실패
  #   PYTHONPATH=/usr/lib/python3.10/dist-packages \
  #     .venv/bin/yolo export model=models/yolo26n.pt format=engine half=True device=0
  #
  #   # 실행
  #   PYTHONPATH=/usr/lib/python3.10/dist-packages \
  #     .venv/bin/python -m src.main --config configs/pipeline.jetson.yaml \
  #     --model models/yolo26n.engine --source 0 --device 0
  #
  # 실측: 12.82 → 16.23 FPS (+26.6%), detect 72.4 → 52.5ms, 탐지력 손실 없음
  model: models/yolo26n.pt
  target_classes:
    - person
  confidence: 0.50
  iou: 0.70
  # 로봇용 트래커는 ReID를 끈 명세 준수 설정을 쓴다(configs/tracker_jetson.yaml 주석 참고).
  tracker: configs/tracker_jetson.yaml
  # 추론 해상도. 개발 PC 실측(사람 4명): 640 → 19.7 FPS / 480 → 23.5 FPS (약 +19%)
  # 480은 작은 사람(멀리 있는 요구조자) 탐지력이 떨어진다. 재난 탐색에서
  # person false negative가 최우선 리스크이므로(AGENTS.md §23) 640을 유지하고,
  # FPS가 부족하면 해상도보다 TensorRT를 먼저 시도한다.
  imgsz: 640

  # FP16 — Jetson 실측 완료(2026-07-31, S15P11A301-98)
  #
  # .pt 경로에서는 detect 커널에 실질 영향이 없다. 켜도 꺼도 FPS가 같다(+0.7%, 잡음 수준).
  #     FP32 12.45 FPS  vs  FP16 12.54 FPS   (런 간 편차가 ±3%)
  # Pose만 5.2 → 2.8ms로 줄지만 Jetson에서 Pose 비중이 7%라 총 FPS에 안 잡힌다.
  #
  # TensorRT 엔진(.engine)에는 half=True로 FP16이 이미 구워져 있다.
  # 따라서 --model로 엔진을 넘기면 이 값은 Pose에만 적용된다.
  #
  # ⚠️ 개발 PC(x86)에서 이 프로파일을 돌릴 때는 이 줄을 지운다. 거기서는 4배 느리다
  #    (FP32 19.69 vs FP16 4.86 FPS). 이 현상은 Jetson에서 재현되지 않는다.
  quantize: 16

# USB 카메라 (BRIO 100). 명세 PoC 실측: /dev/video0, 1280x720 MJPEG 약 29.93 FPS
# (docs/05-통신-서버-영상.md:26)
#
# ⚠️ 실제 로봇 통합 시에는 이 경로를 쓰지 않는다.
# 명세 32-3: "카메라를 OpenCV, YOLO 프로세스, MediaMTX가 각각 열지 않는다.
#             usb_cam 노드만 /dev/video*를 열고 압축 토픽으로 발행한다."
# 카메라 하나를 AI·WebRTC·이벤트 녹화가 나눠 쓰므로, 우리가 직접 열면 다른 소비자가 막힌다.
# 아래 설정은 **ROS2 통합 전 단독 검증용**이다.
camera:
  width: 1280
  height: 720
  # USB 대역폭 한계상 720p 이상에서 무압축(YUY2)은 FPS가 급락한다.
  fourcc: MJPG
  # Linux/Jetson USB 카메라 표준 경로
  backend: v4l2
  fps: 30

# Pose 실행 조건 (명세 25.6). Jetson에서 특히 중요하다.
# 매 프레임 사람 수만큼 Pose를 돌리면 Detect FPS를 유지할 수 없다.
pose_trigger:
  min_bbox_width: 80
  min_bbox_height: 80
  activate_after_frames: 3
  max_fps: 2.0
  deactivate_after_seconds: 3.0
  # 명세 431행의 "약 2FPS, 전체 화면 분석"은 파이프라인 전체 예산이다.
  # true면 사람이 몇 명이든 초당 Pose 실행이 max_fps로 묶이고, 자격을 갖춘
  # 사람들에게 라운드로빈으로 배분된다.
  #
  # false면 track별로만 제한되어 사람 N명일 때 초당 2N회가 된다. 이것이
  # Jetson 실측(S15P11A301-150, 사람 4명)에서 기대 약 127회 대비 300회가
  # 기록된 원인이다. A/B 비교할 때만 false로 두고, 평소에는 true를 유지한다.
  global_budget: true

pose:
  model: models/yolo26n-pose.pt
  confidence: 0.50
  keypoint_confidence: 0.50
  crop_margin: 0.10
  # crop 입력이라 640은 과하다. 개발 PC 실측(FP16 기준): 320 → 4.86 / 640 → 7.38 FPS.
  # FP16 영향이 섞인 수치이므로 Jetson에서 재측정한다. 320을 기본으로 둔다.
  imgsz: 320
  # detector의 quantize와 동일한 주의사항이 적용된다. Jetson에서 실측 후 결정.
  quantize: 16

# 판정 임계값은 개발 PC 프로파일과 동일하게 유지한다.
# 실측 근거가 없는 임의값이므로(AGENTS.md §15) 테스트 영상으로 조정한 뒤 양쪽에 같이 반영한다.
posture:
  torso_horizontal_deg: 55.0
  bbox_aspect_ratio: 1.20
  vertical_extent_ratio: 0.25
  min_valid_keypoints: 4
  # 카메라 광축(앞뒤) 기울기 반영. torso_angle_deg는 이미지 좌표 기준이라
  # 좌우 기울기만 잡는다. 복도 방향으로 누운 사람이 사각지대가 되므로,
  # 어깨 폭 대비 상체 단축률로 앞뒤 기울기를 추정해 큰 쪽을 쓴다.
  depth_tilt: true
  # 똑바로 선 사람의 (상체 길이 / 어깨 폭) 기대비.
  # ⚠️ 해부학 통념값이며 실측 근거가 없다. 실영상 확보 후 조정할 것.
  torso_shoulder_ratio: 1.3
  smoothing_window: 5
  unknown_yields_to_known: true

memory:
  forget_seconds: 10.0
  min_track_buffer: 10
  max_track_buffer: 900

persistence:
  person_confirm_seconds: 1.0
  fallen_seconds: 1.5
  event_cooldown_seconds: 15.0
  inherit_distance_ratio: 1.0

output:
  # 프레임 로그는 SD카드 수명과 용량을 잡아먹는다. Jetson에서는 기본 비활성.
  write_frame_log: false
  jsonl_frames: frames.jsonl
  jsonl_events: events.jsonl
  events_dir: events
  draw_overlay_on_event_image: true
  # 이벤트 확정 프레임에만 Pose를 강제 실행해 증빙 이미지에 골격을 남긴다.
  # Jetson은 헤드리스라 상시 overlay를 그리지 않으므로, 관절을 볼 수 있는 건
  # 이 이벤트 이미지뿐이다. 실측 기준 Pose 1회 약 82ms인데 쿨다운이 15초라
  # 추가 부하는 0.5% 미만이다. 상시 Pose(FPS 절반 이하)와 혼동하지 않는다.
  pose_on_event: true

report:
  schema_version: "1.0"
  robot_id: SENTINEL-01
  mission_id: null
