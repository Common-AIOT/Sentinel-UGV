# Nav2 구성 (S15P11A301-235, 명세 24.1).
#
# ## 전륜 조향 실측 반영 (2026-08-06, S15P11A301-172)
#
# 이 파일은 차동 구동 + 제자리 회전 전제로 쓰여 있었다. 전륜 서보 조향으로
# 바뀌면서 **그 전제가 전부 무효**가 됐고, 실측값이 들어와 다시 세웠다.
#
#   휠베이스 L      0.683 m        조향각 δ_max   22° (좌·우 동일)
#   트랙폭 W        0.530 m        전체 폭        0.615 m
#   차체 길이       0.910 m        바퀴 지름      0.250 m
#
#   R_min = L / tan(δ_max) = 0.683 / tan(22°) = 1.69 m
#
# **제자리 회전을 명령하면 안 된다.** 종전 `RotationShimController` 는 목표
# 방향과 45° 이상 어긋나면 v=0·ω 를 낸다. 조향 차량에서 그것은 앞바퀴만 꺾고
# 전진 0 이므로 로봇이 서 있고, 15초 뒤 progress checker 가 실패로 보고 복구
# 행동 `spin` 을 부른다 — 그것도 제자리 회전이라 또 실패한다. 즉 **한 발짝도
# 못 가고 목표를 포기**한다. shim 과 `spin` 을 뺀 이유다.
#
# ## footprint 를 원이 아니라 다각형으로 둔다
#
# `base_link` 원점이 **후축 중심**이다(자전거 모델이 그 점을 기준으로 적분하고
# 뒷바퀴 엔코더가 그 점의 이동을 보고한다). 그래서 몸집이 앞으로 크게 치우쳐
# 있어 원으로는 표현되지 않는다 — 앞을 덮는 원을 그리면 뒤가 과대해지고, 뒤에
# 맞추면 앞이 벗겨진다.
#
# 앞 0.80·뒤 -0.11 은 차체 길이 0.91 과 휠베이스 0.683 에서 오버행을 반씩 본
# **추정값**이다. 오버행을 재면 이 두 숫자만 고친다.
#
# ## planner 는 NavFn 을 유지하되 한계를 적어 둔다
#
# NavFn 은 회전반경을 모르므로 R_min 1.69m 로 못 따라갈 경로를 낸다. 옆이나
# 뒤쪽 목표에서 드러난다. **정면 직선 목표는 정상 동작**하므로 첫 실기동은
# 그것으로 확인하고, Smac Hybrid-A\* 전환은 R_min 실측(원주행) 뒤에 판정한다
# (S15P11A301-299 가 그 값을 남긴다).
#
# 속도 상한(0.25m/s)은 24.2 자율 탐사 행이다. 사람 접근 0.10m/s 는 여기서
# 다루지 않는다 — 그 감속은 접근 노드(S15P11A301-247)와 안전 체인
# (S15P11A301-237)의 몫이고, 두 곳에 두면 언젠가 한쪽만 바뀐다.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    # /wheel/odometry 는 enable_esp32 일 때만 나온다. static identity 로 돌 때는
    # 이 토픽이 없어 속도 추정이 0 으로 남는데, 경로 계획·추종 검증에는 지장이
    # 없다. 실차에서는 esp32 가 켜지므로 실측 속도가 들어온다.
    odom_topic: /wheel/odometry
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    # 20Hz 기본에서 10Hz 로 낮춘다. 0.25m/s 에서 주기당 2.5cm — 충분하고,
    # Jetson 은 YOLO·SLAM·인코딩과 대역폭을 나눠 쓴다(8.1 LPDDR5).
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # 기본 10초. 저속(0.25m/s) 로봇이라 여유를 준다 — 너무 짧으면 정상
      # 저속 주행이 정체로 오판돼 recovery 가 돈다.
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30

    FollowPath:
      # shim 을 벗겼다 (S15P11A301-172). 조향 차량은 제자리 회전을 못 한다 —
      # 머리말 참고. RPP 를 직접 쓴다.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── RPP ──
      # 첫 실기동은 0.15 로 낮춘다. 25cm 바퀴에 1m 급 차체이고 정지거리가 아직
      # 실측되지 않았다(S15P11A301-299). 확인 뒤 24.2 상한 0.25 로 올린다.
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.1
      # 조향 차량은 제자리에서 방향을 맞출 수 없다. true 로 두면 RPP 가
      # v=0·ω 를 내고 로봇은 앞바퀴만 꺾은 채 서 있는다.
      use_rotate_to_heading: false
      # 최소 회전반경. RPP 는 이 값을 직접 쓰지 않지만, 여기 적어 두면 Smac
      # 전환 때 옮길 자리가 명확하고 실측 근거가 한곳에 남는다.
      minimum_turning_radius: 1.69
      max_robot_pose_search_dist: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      # 미지 통과 금지. 23.3 도달성 판정("plan 생성 불가 후보 제거")이 이 값에
      # 기대고 있다 — 미지를 통과시키면 벽 뒤 frontier 도 도달 가능으로 나온다.
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # `spin` 을 뺐다 (S15P11A301-172). 제자리 회전 복구 행동이라 조향 차량에서는
    # 성공할 수 없고, 실패하는 복구를 반복하며 목표를 포기하게 만든다.
    #
    # `backup` 은 남긴다 — 후진은 물리적으로 가능하다. 다만 **후방 센서가 없어서**
    # 거리·속도를 제한해야 하고 그 근거는 S15P11A301-299 의 후진 가능 범위다.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    max_rotational_vel: 0.6             # 24.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    # 한 지점 실패로 전체 복귀를 포기하지 않는다 — 빵조각 역추적(23.6 2단,
    # S15P11A301-246)은 중간 지점 몇 개를 건너뛰어도 성립한다.
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      # 실측 다각형 (S15P11A301-172). 원점이 후축 중심이라 몸집이 앞으로
      # 치우쳐 있어 robot_radius 로는 표현되지 않는다 — 머리말 참고.
      # 앞 0.80 / 뒤 -0.11 / 좌우 ±0.31(전체 폭 0.615 의 절반).
      footprint: "[[0.80, 0.31], [0.80, -0.31], [-0.11, -0.31], [-0.11, 0.31]]"
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        # slam_toolbox 의 /map 이 latched(transient_local)다. 이걸 안 켜면
        # 정지 중(지도 갱신 없음)에는 costmap 이 영영 비어 있다 — S15P11A301-172
        # 탐사 노드에서 같은 QoS 문제를 밟았다.
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 반폭 0.31 에 약 19cm 여유. 정지거리가 실측되면(S15P11A301-299)
        # 그 값으로 다시 잡는다. 좁은 실내에서 이보다 키우면 통로가 막힌다.
        inflation_radius: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 실측 다각형 (S15P11A301-172). 원점이 후축 중심이라 몸집이 앞으로
      # 치우쳐 있어 robot_radius 로는 표현되지 않는다 — 머리말 참고.
      # 앞 0.80 / 뒤 -0.11 / 좌우 ±0.31(전체 폭 0.615 의 절반).
      footprint: "[[0.80, 0.31], [0.80, -0.31], [-0.11, -0.31], [-0.11, 0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 반폭 0.31 에 약 19cm 여유. 정지거리가 실측되면(S15P11A301-299)
        # 그 값으로 다시 잡는다. 좁은 실내에서 이보다 키우면 통로가 막힌다.
        inflation_radius: 0.50
