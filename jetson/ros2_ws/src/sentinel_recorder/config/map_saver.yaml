# 지도 저장 설정 (S15P11A301-171, 명세 13.2·31-10)
/**:
  ros__parameters:
    # mission_manager가 TRANSIENT_LOCAL로 발행한다. COMPLETED 전이를 보고 저장한다.
    mission_status_topic: /mission/status

    # 링 버퍼·pending과 같은 볼륨에 둔다. 31-10이 "업로드 대기 영상·지도"를
    # 로컬 보존 대상으로 정했으므로 재부팅에도 남아야 한다(/tmp 금지).
    map_directory: /var/lib/sentinel/maps

    # slam_toolbox가 노출하는 서비스. 이 노드는 slam_toolbox가 떠 있을 때만
    # 저장할 수 있다 — 없으면 경고를 남기고 넘어간다.
    save_map_service: /slam_toolbox/save_map

    # 저장 재시도 (실측 근거).
    #
    # slam_toolbox 내부 map_saver는 /map을 2초만 구독하고 기다립니다(nav2 map_io
    # 기본값). 우리 /map은 slam_toolbox.yaml의 map_update_interval: 2.0 때문에
    # 2초 주기로 발행되어 두 값이 정확히 맞물립니다. 실측에서 한 번은 잡히고 한
    # 번은 "Failed to spin map subscription"으로 놓쳤습니다(result=255).
    #
    # 지연을 발행 주기보다 크게 둬서 다음 발행을 확실히 건너뜁니다.
    # map_update_interval을 낮추는 방법도 있지만 SLAM의 CPU를 상시로 더 쓰고,
    # 저장은 임무당 한 번뿐이라 재시도가 값이 쌉니다.
    save_retry_limit: 4
    save_retry_delay_seconds: 2.5

    # --- 업로드 (S15P11A301-171 후반부, 백엔드는 S15P11A301-185) ---
    #
    # map_uploader가 쓴다. 저장 노드와 같은 파일에 두는 것은 map_directory를
    # 두 노드가 반드시 같은 값으로 봐야 하기 때문이다 — 갈리면 업로더가
    # 빈 디렉터리를 훑는다.
    # apex 도메인(sentinel-ugv.xyz)은 Vercel 프론트다. API는 별 호스트이며
    # 여기에 apex를 쓰면 모든 요청이 404가 된다 — 프론트가 200을 주므로 망
    # 문제로 보이지도 않는다. 실측으로 확인했다(S15P11A301-171).
    backend_base_url: https://api.sentinel-ugv.xyz
    auth_token: ''

    # 디렉터리를 훑는 주기. 저장 완료를 토픽으로 받지 않고 폴링하는 이유는
    # 프로세스가 죽은 사이에 저장된 지도와 망이 끊겼던 동안 쌓인 지도를
    # 재기동만으로 집어야 하기 때문이다(31-10).
    poll_period_seconds: 15.0

    # 한 주기에 올리는 지도 수. 지도는 이벤트 영상보다 작지만(수백 KB) 여러
    # 임무가 쌓였을 때 한꺼번에 올리면 스트리밍 대역을 뺏는다.
    max_per_cycle: 1

    # 재시도 간격. 32-3이 무한 재시작을 금지하므로 표로 둔다. 지수적으로
    # 늘리지 않는 이유는 현장에서 Wi-Fi가 돌아왔을 때 몇 분씩 기다리면
    # 안 되기 때문이다. 4xx는 재시도하지 않고 영구 실패로 기록한다.
    retry_backoff_seconds: [5.0, 15.0, 60.0, 300.0]

    # 완료 호출을 건너뛴다. 백엔드 없이 PUT 경로만 시험할 때만 쓴다.
    skip_complete: false
