# Sentinel UGV 트래커 설정 [Jetson 프로파일 — 명세 준수]
#
# 개발 PC용 configs/tracker_sentinel.yaml 과의 유일한 차이는 **ReID 비활성**이다.
#
# 왜 로봇에서는 끄는가
#
# 1) 명세가 정밀 재식별을 세 곳에서 명시적으로 제외한다.
#    docs/01-프로젝트-개요.md:85  "피해자 정밀 재식별" (제외 목록)
#    docs/01-프로젝트-개요.md:95  "다수 사람의 정밀 재식별" (제외 목록)
#    docs/04-자율주행-AI.md:404   "정밀 재식별은 범위에서 제외한다"
#
# 2) Orin Nano 8GB는 SLAM·Nav2·WebRTC와 자원을 나눠 쓴다. ReID는 사람 crop마다
#    추가 추론이 들어가므로 Detect 15FPS 목표(명세 25.6)를 위협한다.
#    개발 PC 실측으로도 FPS가 약 30% 떨어졌다.
#
# 3) 실제 로봇에는 더 나은 신원 기준이 있다. 쓰러진 사람은 움직이지 않으므로
#    지도 좌표가 외모보다 안정적이다. 명세의 중복 판정도 위치·시간 기반이다
#    (docs/04-자율주행-AI.md:81 "기존 위치 1m 이내 AND 최근 15초 이내").
#
# 개발 PC에서는 tracker_sentinel.yaml(ReID 켬)로 실험하고,
# 로봇에는 이 파일을 쓴다. 시야를 벗어난 사람의 trackId 유지는 포기하며,
# 그 역할은 SLAM 연동 후 mapPose가 대신한다.

tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.35
# memory.forget_seconds에서 실측 FPS로 자동 환산되므로 이 값은 초기값일 뿐이다.
track_buffer: 300
match_thresh: 0.8
fuse_score: True

# 이동하는 카메라 보정. UGV는 주행하며 촬영하므로 필수다.
# (명세는 ByteTrack을 지정하지만 ByteTrack에는 GMC가 없다 — AGENTS.md §0 이탈 1)
gmc_method: sparseOptFlow

# ReID 비활성 — 명세 준수
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
