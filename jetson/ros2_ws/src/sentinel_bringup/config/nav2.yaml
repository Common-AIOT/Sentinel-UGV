# Nav2 구성 (S15P11A301-235, 명세 24.1).
#
# ## 전륜 조향 실측 반영 (2026-08-06, S15P11A301-172)
#
# 이 파일은 차동 구동 + 제자리 회전 전제로 쓰여 있었다. 전륜 서보 조향으로
# 바뀌면서 **그 전제가 전부 무효**가 됐고, 실측값이 들어와 다시 세웠다.
#
#   휠베이스 L      0.683 m        조향각 δ_max   22° (좌·우 동일)
#   트랙폭 W        0.530 m        전체 폭        0.615 m
#   차체 길이       0.910 m        바퀴 지름      0.250 m
#
#   R_min = L / tan(δ_max) = 0.683 / tan(22°) = 1.69 m
#
# **제자리 회전을 명령하면 안 된다.** 종전 `RotationShimController` 는 목표
# 방향과 45° 이상 어긋나면 v=0·ω 를 낸다. 조향 차량에서 그것은 앞바퀴만 꺾고
# 전진 0 이므로 로봇이 서 있고, 15초 뒤 progress checker 가 실패로 보고 복구
# 행동 `spin` 을 부른다 — 그것도 제자리 회전이라 또 실패한다. 즉 **한 발짝도
# 못 가고 목표를 포기**한다. shim 과 `spin` 을 뺀 이유다.
#
# ## footprint 를 원이 아니라 다각형으로 둔다
#
# `base_link` 원점이 **후축 중심**이다(자전거 모델이 그 점을 기준으로 적분하고
# 뒷바퀴 엔코더가 그 점의 이동을 보고한다). 그래서 몸집이 앞으로 크게 치우쳐
# 있어 원으로는 표현되지 않는다 — 앞을 덮는 원을 그리면 뒤가 과대해지고, 뒤에
# 맞추면 앞이 벗겨진다.
#
# 앞 0.80·뒤 -0.11 은 차체 길이 0.91 과 휠베이스 0.683 에서 오버행을 반씩 본
# **추정값**이다. 오버행을 재면 이 두 숫자만 고친다.
#
# ## 곡률 상한을 지키는 층은 Nav2 가 아니다 (2026-08-08, S15P11A301-348)
#
# **RPP 에는 곡률 상한 기능이 없다.** 헤더의 `applyConstraints` 와 멤버 변수를
# 확인했다 — 곡률 관련은 `regulated_linear_scaling_min_radius` 하나이고 그것은
# 「급하면 감속」이지 「급한 것을 금지」가 아니다. 즉 Nav2 안에는 이 차량이 못 도는
# 곡률을 애초에 만들지 않게 하는 층이 없다.
#
#   NavFn         회전반경을 모른다 → 못 따라갈 경로를 낸다
#   RPP           그 경로를 따라가려 곡률을 명령한다 (상한 없음)
#   vehicle_kinematics  δ 를 δ_max 로 **클램프한다** ← 상한을 지키는 유일한 층
#
# 클램프 자체는 안전하다(조향각을 상한으로 자른다). 문제는 상위가 그 사실을 모른
# 채 계속 무리한 곡률을 낸다는 것이고, 그 대가가 2026-08-08 실기동에 그대로
# 찍혔다 — `steering_clamp_count 7224`, `spin_in_place_reject_count 43`.
# 로봇은 조향을 최대로 붙인 채 넓은 호로 벌어지고, 목표에 수렴하지 못해
# progress checker 가 15초 뒤 포기한다.
#
# 근본 해법은 회전반경을 아는 planner(Smac Hybrid-A*)이며 R_min 실측 뒤에
# 판정한다(TBD-NAV-001, S15P11A301-299 3단계). 그 전까지는 이 층 구분을 알고
# 있는 것이 최선이다 — 모르면 「왜 경로를 못 따라가지」를 매번 다시 조사한다.
#
# ## planner 는 NavFn 을 유지하되 한계를 적어 둔다
#
# NavFn 은 회전반경을 모르므로 R_min 1.69m 로 못 따라갈 경로를 낸다. 옆이나
# 뒤쪽 목표에서 드러난다. **정면 직선 목표는 정상 동작**하므로 첫 실기동은
# 그것으로 확인하고, Smac Hybrid-A\* 전환은 R_min 실측(원주행) 뒤에 판정한다
# (S15P11A301-299 가 그 값을 남긴다).
#
# 속도 상한(0.25m/s)은 24.2 자율 탐사 행이다. 사람 접근 0.10m/s 는 여기서
# 다루지 않는다 — 그 감속은 접근 노드(S15P11A301-247)와 안전 체인
# (S15P11A301-237)의 몫이고, 두 곳에 두면 언젠가 한쪽만 바뀐다.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    # 전륜 조향용 복구 트리 (S15P11A301-172). 기본 트리는 Spin 을 호출하는데
    # behavior_plugins 에서 spin 을 뺐으므로 bt_navigator 가 활성화에 실패하고
    # **Nav2 전체가 inactive 로 남는다**(2026-08-07 무부하 검증에서 발견).
    # 플러그인 목록과 이 경로는 한 쌍이다 — 한쪽만 바꾸면 다시 이렇게 된다.
    # 경로는 `nav2.launch.py` 가 넘긴다 — 여기서는 못 쓴다. params YAML 은 launch
    # 치환(`$(find-pkg-share ...)`)을 해석하지 않아 문자열이 그대로 전달되고,
    # bt_navigator 가 그 이름의 파일을 못 열어 활성화에 실패한다(2026-08-07 실측).
    # through_poses 트리도 함께 넘겨야 한다 — bt_navigator 는 둘 다 로드한다.
    # /wheel/odometry 는 enable_esp32 일 때만 나온다. static identity 로 돌 때는
    # 이 토픽이 없어 속도 추정이 0 으로 남는데, 경로 계획·추종 검증에는 지장이
    # 없다. 실차에서는 esp32 가 켜지므로 실측 속도가 들어온다.
    odom_topic: /wheel/odometry
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    # 20Hz 기본에서 10Hz 로 낮춘다. 0.25m/s 에서 주기당 2.5cm — 충분하고,
    # Jetson 은 YOLO·SLAM·인코딩과 대역폭을 나눠 쓴다(8.1 LPDDR5).
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # RPP 가 유효 명령을 못 내는 상태(충돌 예측 등)를 이 시간까지 참는다.
    # 0.5 였던 두 번째 실기동에서 collision-ahead 가 뜨자마자 7/7 목표가
    # 중단됐다 (S15P11A301-360). 일시적 예측(지도 갱신 중, 스캔 노이즈)은
    # 몇 사이클이면 걷히므로 2초를 준다 — 진짜 막힘은 2초 뒤에도 막혀 있고,
    # 그때 중단·재계획하는 것이 맞다.
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # 기본 10초. 저속(0.25m/s) 로봇이라 여유를 준다 — 너무 짧으면 정상
      # 저속 주행이 정체로 오판돼 recovery 가 돈다.
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      # 도착 자세(yaw)를 사실상 보지 않는다 (S15P11A301-172).
      #
      # 조향 차량은 제자리 회전을 못 하므로 **도착 헤딩을 고를 수 없다** —
      # 접근 경로가 정하는 대로 끝난다. 0.30rad(17°) 를 요구하면 위치는 맞는데
      # 자세가 안 맞아 목표가 영원히 「도달」이 되지 않고, 로봇이 그 자리에서
      # 멈춘 채 progress checker 의 15초를 채운 뒤 ABORTED 로 끝난다. 그러면
      # 도달 실패로 적립돼 세 번이면 그 자리가 후보에서 빠진다 — 실제로는
      # **도착했는데** 못 갔다고 기록되는 것이다.
      #
      # 탐사가 목표 yaw 를 미관측 방향으로 잡는 것은 「도착 즉시 정면이 유효
      # 관측」을 노린 것이고, 그 헤딩은 goal checker 가 아니라 **스윕 실행부**가
      # 주행으로 맞춘다(아직 미구현 — S15P11A301-172 남은 항목).
      yaw_goal_tolerance: 3.15

    FollowPath:
      # shim 을 벗겼다 (S15P11A301-172). 조향 차량은 제자리 회전을 못 한다 —
      # 머리말 참고. RPP 를 직접 쓴다.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ── RPP ──
      # **0.15 는 잠정이 아니라 결정된 기본이다** (2026-08-08, S15P11A301-343).
      # 종전에는 "첫 실기동용, 확인 뒤 0.25 로 올린다"였는데 실측 두 개가 이 값을
      # 확정했다: (1) 정지 마찰 경계가 PWM 17~25% 사이라 0.15 명령(PWM 25%)이
      # 움직이는 최저 대역이고, (2) 교실 시연 환경에서 이 속도가 적정하다고
      # 판단했다. 넓은 환경으로 옮기면 24.2 상한 0.25 까지 올릴 수 있으나
      # 정지거리 실측(S15P11A301-299)이 선행이다.
      #
      # 주의: PWM 매핑이 실측으로 잡히기 전에는(S15P11A301-342) 명령 0.15 의
      # 실속도가 이와 다르다 — 2026-08-08 줄자 실측으로 **실속도 ~0.28** 이었다.
      #
      # **체감 속도는 그 0.28 로 확정됐다** (같은 날 교실 주행 판정, S15P11A301-343).
      # 따라서 342 매핑이 머지되어 명령이 정직해지는 날, 같은 체감을 유지하려면
      # **0.30 이 기본이다** (2026-08-09, S15P11A301-342). 종전 0.15 는 속도
      # 보고 3.4배 결함(339) 위에서 고른 값이었고, 결함 수정 후 재실측하니
      # 데드밴드(150mm/s) 경계라 실속도가 사실상 0 이었다. 0.30 은 명령=실속도
      # 99%(줄자 148cm/기대 150cm, 후진 159cm)에 교실 체감도 적정으로 확인됐다.
      # 0.20 은 정지 마찰 구간이라 실속도 39% — 저속 명령은 쓰지 않는다.
      # velocity_smoother 상한(safety.yaml)·24.2 상한을 0.30 으로 함께 올렸다 —
      # 상한이 낮으면 이 층이 명령을 깎아 로봇이 이유 없이 느려진 것처럼 보인다.
      desired_linear_vel: 0.30
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      # 데드밴드(150mm/s) 위여야 한다 (S15P11A301-357). 0.05 는 도착 직전 로봇을
      # 기어가게 만드는데 그 속도는 펌웨어가 0 으로 만들어 영원히 도착하지 못한다.
      # 0.25 는 확실히 움직이는 최저 대역(342 실측: 명령 대비 실속도 82%)이다.
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # **이것은 곡률 상한이 아니라 감속 임계다** (S15P11A301-348). 반경이 이 값
      # 아래로 급해지면 RPP 가 속도를 줄이는데, 그 곡선을 여전히 명령한다.
      #
      # 1.8 은 341 완료 후 확정한 값이다 (S15P11A301-357). 실측 R_min 이 좌 1.37m·
      # 우 1.76m 이므로 안전측(우회전) 위로 잡았다 — 못 도는 곡률에 접근하면
      # 미리 감속해 조향 클램프 구간이 줄어든다. 0.4 는 차동 구동 시절 값이었다.
      regulated_linear_scaling_min_radius: 1.8
      # 감속 하한도 데드밴드(150mm/s) 위여야 한다 (S15P11A301-357). 0.1 이던
      # 2026-08-09 첫 실기동에서 급곡률 감속이 이 값까지 내려가자 펌웨어가 0 으로
      # 만들었다 — 조향은 상한에 붙고 구동만 죽어 「바퀴만 꺾고 서 있는」 증상.
      regulated_linear_scaling_min_speed: 0.25
      # 조향 차량은 제자리에서 방향을 맞출 수 없다. true 로 두면 RPP 가
      # v=0·ω 를 내고 로봇은 앞바퀴만 꺾은 채 서 있는다.
      use_rotate_to_heading: false
      # Smac Hybrid-A*(아래 planner_server)가 REEDS_SHEPP 로 후진 구간을
      # 계획하므로 RPP 도 후진 추종을 켠다 (S15P11A301-358). 차는 후진이
      # 검증돼 있다(0.30 에서 159cm, S15P11A301-342). use_rotate_to_heading
      # 과는 상호배타 — 둘 다 켜면 RPP 가 기동 시 예외를 던진다.
      allow_reversing: true
      max_robot_pose_search_dist: 1.0
      # `minimum_turning_radius` 를 여기서 제거했다 (S15P11A301-348).
      # **RPP 에 그 이름의 파라미터가 없어 조용히 무시된다** — S15P11A301-172 가
      # 근거를 남길 의도로 넣었는데, 설정 자리에 있으면 「곡률 상한이 걸려 있다」로
      # 읽힌다(2026-08-08 에 실제로 그렇게 오독했다). 실측 근거는 머리말에 있다.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # NavFn → Smac Hybrid-A* (S15P11A301-358, TBD-NAV-001 확정).
    #
    # NavFn 은 경로에 방향 개념이 없고 회전반경도 모른다. 두 실기동에서 그
    # 대가가 그대로 나왔다: 후방·측면 목표로 못 따라갈 경로를 내고, RPP 가
    # 그 곡률을 요구하다 조향이 상한에 붙어(steering_clamp 192→446) 좌우로
    # 헤맸다. Hybrid-A* 는 R_min 을 알고 실차가 따라갈 수 있는 경로만 낸다.
    #
    # **Humble(1.1.20)에서 후진 계획이 된다** (2026-08-09 ComputePathToPose 실측):
    # costmap 비용 0 인 회랑에서 정후방 1.1m 목표 → 포즈 16개 전원 후진(진행
    # 방향과 heading 반대)의 일직선 경로. REEDS_SHEPP 모델 자체가 후진 프리미티브를
    # 담당한다 — allow_reverse_expansion 은 Lattice planner 전용 파라미터라 여기엔
    # 없는 것이 정상이다(같은 날 오독했다가 정정, 아래 함정 참고).
    #
    # **함정 — 계획 실패의 첫 용의자는 목표 주변 costmap 비용이다.** 같은 날
    # 「자유 공간인데 후방 실패」로 오판한 적이 있다: /map 셀은 자유(0)였지만
    # global costmap 의 벽 팽창이 목표를 덮고 있었다. /map 이 아니라
    # /global_costmap/costmap 을 봐야 planner 가 보는 세계다.
    # 후진 실주행 검증(cusp 의 펌웨어 방향전환 데드타임 500ms 와 RPP 상호작용)은
    # 아직 남아 있다(S15P11A301-358).
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      # 미지 통과 금지. 23.3 도달성 판정("plan 생성 불가 후보 제거")이 이 값에
      # 기대고 있다 — 미지를 통과시키면 벽 뒤 frontier 도 도달 가능으로 나온다.
      # NavFn 시절부터의 결합이며 planner 를 바꿔도 유지한다.
      allow_unknown: false
      # 실측 R_min 좌 1.37m·우 1.76m (S15P11A301-341) — 안전측(큰 쪽) 위.
      # 작게 적으면 실차가 못 도는 호를 계획해 NavFn 시절 문제로 돌아간다.
      # RPP 의 regulated_linear_scaling_min_radius(1.8)와 같은 근거·같은 값.
      minimum_turning_radius: 1.8
      # REEDS_SHEPP 가 후진 확장을 담당한다(DUBIN 은 전진 전용).
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      # 후진은 전진보다 2배 비싸게 — 짧은 빠져나오기 후진은 허용하되
      # 긴 후진 주행은 억제한다(후방은 카메라가 없다).
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      # 해석적 확장(목표 근처 곡선 이어붙이기)의 상한. 교실 규모(수 m)에서
      # 3m 면 충분하고, 크게 두면 장애물 비용을 무시한 긴 지름길이 생긴다.
      analytic_expansion_max_length: 3.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # 1Hz 재계획(expected_planner_frequency)과 양립하는 상한.
      max_planning_time: 3.0
      downsample_costmap: false
      downsampling_factor: 1
      lookup_table_size: 20.0
      cache_obstacle_heatmap: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # `spin` 을 뺐다 (S15P11A301-172). 제자리 회전 복구 행동이라 조향 차량에서는
    # 성공할 수 없고, 실패하는 복구를 반복하며 목표를 포기하게 만든다.
    #
    # `backup` 은 남긴다 — 후진은 물리적으로 가능하다. 다만 **후방 센서가 없어서**
    # 거리·속도를 제한해야 하고 그 근거는 S15P11A301-299 의 후진 가능 범위다.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    max_rotational_vel: 0.6             # 24.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    # 한 지점 실패로 전체 복귀를 포기하지 않는다 — 빵조각 역추적(23.6 2단,
    # S15P11A301-246)은 중간 지점 몇 개를 건너뛰어도 성립한다.
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      # 실측 다각형 (S15P11A301-172). 원점이 후축 중심이라 몸집이 앞으로
      # 치우쳐 있어 robot_radius 로는 표현되지 않는다 — 머리말 참고.
      # 앞 0.80 / 뒤 -0.11 / 좌우 ±0.31(전체 폭 0.615 의 절반).
      footprint: "[[0.80, 0.31], [0.80, -0.31], [-0.11, -0.31], [-0.11, 0.31]]"
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        # slam_toolbox 의 /map 이 latched(transient_local)다. 이걸 안 켜면
        # 정지 중(지도 갱신 없음)에는 costmap 이 영영 비어 있다 — S15P11A301-172
        # 탐사 노드에서 같은 QoS 문제를 밟았다.
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # **0.50 → 0.35** (S15P11A301-366). 반폭 0.31 에 4cm 여유다.
        #
        # 0.50 은 「반폭 + 19cm」로 잡은 값이었고 주석은 「좁은 실내에서 이보다
        # 키우면 통로가 막힌다」고 경고했는데, 실측해 보니 **0.50 도 이 공간에는
        # 이미 과했다.** 2026-08-09: /map 자유 셀의 31%가 costmap 에서 치명이었고
        # 그 97%가 실제 벽에서 0.5m 이내였다 — 팽창 버그가 아니라 방이 좁은 것이다.
        # 그 결과 frontier 목표 101개 중 계획 가능한 것이 3개뿐이었고 로봇이 한
        # 발짝도 못 움직였다(Nav2 가 목표를 거부).
        #
        # 대가: 벽에 더 가까이 붙어 다닌다. 충돌 자체는 collision_monitor 정지
        # 구역(범퍼 앞 0.25m, 좌우 ±0.33)이 최후 방어선으로 막는다.
        inflation_radius: 0.35

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 실측 다각형 (S15P11A301-172). 원점이 후축 중심이라 몸집이 앞으로
      # 치우쳐 있어 robot_radius 로는 표현되지 않는다 — 머리말 참고.
      # 앞 0.80 / 뒤 -0.11 / 좌우 ±0.31(전체 폭 0.615 의 절반).
      footprint: "[[0.80, 0.31], [0.80, -0.31], [-0.11, -0.31], [-0.11, 0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # global 과 같은 값이어야 한다 (S15P11A301-366). 두 곳이 어긋나면
        # 전역 계획이 통과시킨 경로를 로컬이 막아 로봇이 제자리에서 재계획만 한다.
        # 근거는 global_costmap 쪽 주석에 있다.
        inflation_radius: 0.35
