# systemd-time-wait-sync 대기 상한 (S15P11A301-306)
#
# 설치 (기기당 한 번, sudo):
#   sudo mkdir -p /etc/systemd/system/systemd-time-wait-sync.service.d
#   sudo cp scripts/systemd/systemd-time-wait-sync-timeout.conf \
#        /etc/systemd/system/systemd-time-wait-sync.service.d/timeout.conf
#   sudo systemctl enable systemd-time-wait-sync.service
#   sudo systemctl daemon-reload
#
# ## 왜 상한이 필요한가
#
# sentinel-demo.service 를 time-sync.target 뒤로 보내면(S15P11A301-306) 부팅
# 자동 기동이 이 유닛의 완료를 기다린다. 그런데 배포판이 주는 유닛은
# `TimeoutStartSec=infinity` 라 커널이 시각 동기를 보고할 때까지 **무한정
# 기다린다.** 확인:  systemctl show systemd-time-wait-sync -p TimeoutStartUSec
#
# 시연장에 NTP 가 없으면 그 대기가 끝나지 않고, 스택은 "시계가 안 맞아서"가
# 아니라 **아예 뜨지 않는다.** 고치려던 것보다 나쁜 실패다.
#
# ## 90초의 근거
#
# 실측에서 timesyncd 가 게이트웨이(192.168.0.1)로 첫 동기를 마치는 데 걸린
# 시간은 부팅 후 약 4분이었다(2026-08-06: 13:57:18 기동 → 14:01:12 동기). 다만
# 그 4분의 대부분은 이 유닛이 없어 아무도 재촉하지 않은 채 timesyncd 의 기본
# 폴링 간격을 기다린 시간이다. 이 유닛을 켜면 sysinit 단계에서 동기를 재촉하므로
# 정상 네트워크에서는 수 초 안에 끝난다.
#
# 90초는 그 여유 위에 잡은 값이다. 네트워크가 정상이면 절대 닿지 않고, 없으면
# 90초 뒤 포기하고 부팅을 진행한다. 포기했을 때 스택은 틀린 시계로 뜨며 이
# 티켓의 증상이 그대로 재현된다 - 그때는 시각 동기가 붙은 뒤 손으로
# demo_down/demo_up 해야 한다.
#
# 상한에 걸렸는지는 저널로 확인한다:
#   journalctl -u systemd-time-wait-sync -b
#
# 상한에 걸려 이 유닛이 실패해도 부팅은 막히지 않는다. 배포판 유닛이
# `WantedBy=sysinit.target` 이라 약한 의존이고, `Before=time-sync.target` 은
# 순서만 정하므로 실패한 작업도 "끝난" 것으로 보아 target 이 도달한다.
# 즉 시각이 안 맞아도 스택은 뜬다 - 틀린 시계로 뜰 뿐이다.
[Service]
TimeoutStartSec=90
