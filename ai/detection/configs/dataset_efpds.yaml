# E-FPDS (Extended Fallen Person Dataset) — scripts/convert_efpds.py 로 생성
#
# 인용 의무: Fallen People Detection Capabilities Using Assistive Robot.
#            S. Maldonado-Bascón et al. Electronics 2019.
#
# ⚠️ test split은 배포 조건상 "strictly for reporting of results alone"이다.
#    여기에 넣지 않는다. 학습·검증 어디에도 쓰지 않는다.
#
# split은 저자가 장소가 겹치지 않게 나눠둔 것을 그대로 따른다.
#   train  split1,2,3,10,11   /   val  split12,13
#
# path는 train_detect.py가 이 파일 위치 기준 절대경로로 바꿔 넘긴다.

path: ../data/efpds
train: images/train
val: images/val

names:
  0: person
